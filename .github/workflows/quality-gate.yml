name: Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # === 第一层：代码格式和类型检查 ===
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ruff mypy
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ --output-format=github

      - name: Ruff format check
        run: ruff format src/ --check --diff

      - name: Mypy strict
        run: mypy --strict src/gugu/ --ignore-missing-imports

  # === 第二层：测试和质量门禁 ===
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src/gugu --cov-report=term-missing --cov-fail-under=70

      - name: Quality gate (strict mode)
        run: python scripts/quality_gate.py --mode strict

      - name: Check debug code
        run: python scripts/check_debug_code.py

  # === 第三层：安全扫描 ===
  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        run: bandit -r src/gugu/ -c pyproject.toml -f json -o bandit-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

  # === 第四层：文档一致性检查 ===
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check doc-code consistency
        run: |
          python -c "
          import yaml
          from pathlib import Path

          # 读取配置
          settings = yaml.safe_load(Path('config/settings.yaml').read_text())
          manifest = yaml.safe_load(Path('config/strategy_manifest.yaml').read_text())

          # 检查策略一致性
          verified = set(settings.get('strategy', {}).get('verified_strategies', []))
          experimental = set(settings.get('strategy', {}).get('experimental_strategies', []))
          manifest_enabled = {k for k, v in manifest.get('signal_strategies', {}).items() if v.get('enabled')}

          # verified + experimental 应该覆盖 manifest 中启用的策略
          missing = manifest_enabled - verified - experimental
          if missing:
              print(f'ERROR: 策略在 manifest 中启用但不在 settings 中: {missing}')
              exit(1)

          # 检查重叠
          overlap = verified & experimental
          if overlap:
              print(f'ERROR: 策略同时出现在 verified 和 experimental: {overlap}')
              exit(1)

          print('✅ 文档一致性检查通过')
          "

  # === 第五层：构建验证 ===
  build:
    runs-on: ubuntu-latest
    needs: [test, security, docs]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install hatch

      - name: Build package
        run: hatch build

      - name: Verify package
        run: hatch run python -c "import gugu; print('✅ Package import OK')"

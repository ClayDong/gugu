name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          uv sync --group dev
      - name: Lint with ruff
        run: |
          uv run ruff check src/gugu scripts
      - name: Type check changed critical modules with mypy
        run: |
          uv run mypy --python-version 3.12 src/gugu/config src/gugu/filters/money_flow.py src/gugu/web/app.py --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          uv sync --group dev
      - name: Run tests
        run: |
          uv run pytest tests/ -v --cov=src/gugu --cov-report=term-missing --timeout=30 -x
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

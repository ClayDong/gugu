# gugu 交易系统主配置

# ========== 自选股 ==========
# 自选股列表（代码用字符串，前缀 0 容易被 YAML 解析为八进制，务必加引号）
watchlist:
  # 真实持仓（必须纳入扫描与风控监控）
  - "002460"   # 赣锋锂业
  - "002714"   # 牧原股份
  - "510310"   # 沪深300ETF易方达
  - "510500"   # 中证500ETF南方
  - "512480"   # UC半导体ETF国联安
  - "588000"   # 科创50ETF华夏
  # 自选股（手动关注的股票）
  - "600519"   # 贵州茅台
  - "300750"   # 宁德时代
  - "000858"   # 五粮液
  - "601318"   # 中国平安
  - "000333"   # 美的集团
  # 注：auto_select=true 时，系统会在每次扫描中自动从全市场选股
  # 选出的候选股仅参与当次扫描，不会自动写入 watchlist

# ========== 数据源 ==========
# 三级冗余：sina 主源 → akshare 降级 → eastmoney 兜底
# sina: 新浪财经直连（稳定、不限流），适合实时行情和历史K线
# akshare: 东方财富封装（功能全，但部分网络环境被限流）
# eastmoney: 东方财富直连 HTTP（兜底，单股查询，避免全市场快照限流）
data:
  primary_source: sina           # 主源：新浪（直连 HTTP，稳定性最好）
  fallback_sources:              # 降级源（按顺序尝试）
    - eastmoney                  # 第一备用：东方财富直连 HTTP（全市场快照稳定）
    - akshare                    # 第二备用：akshare（东方财富后端，全市场快照可能被限流）
  fetch_interval_seconds: 120    # 实时采集间隔（秒）
  fail_threshold: 3              # 连续失败 N 次降级
  fail_cooldown_seconds: 300     # 降级冷却时间
  cache_ttl_seconds: 120         # 实时数据缓存
  history_db: sqlite:///data/gugu.db
  parquet_dir: data/parquet

# ========== 策略 ==========
strategy:
  # 启用的策略列表（v0.3.0：启用趋势+均值回归互补策略，weighted 融合）
  # 趋势跟踪（牛市/趋势市有效）：box_breakout, turtle, dual_ma
  # 均值回归（震荡市有效）：bollinger, rsi_reversal
  # 回测基准：box_breakout +30.02%, turtle +10.98%, dual_ma +2.98%
  # 注释掉的策略在回测中表现不佳，但可能与趋势策略形成低相关互补
  enabled:
    - box_breakout
    # v0.4.5 双阴钱袋子策略：100股 +2.81%/夏普-0.02/胜率35%（收益稳定正，夏普边际）
    # 50股 +3.90%/夏普0.03/胜率37%（3/4条件通过），依赖 MarketFilter 在熊市拦截
    # 1710股大样本 +2.65%/夏普0.01/胜率37.4%（v0.4.7 全市场验证，收益稳定正，夏普边际）
    - double_yin
    # v0.5.0 capital_flow_alert 禁用：100股回测 -1.42%/夏普-0.47/胜率26.6%，未通过验证
    # 策略代码保留作为卖出信号库（4 个卖出特征识别主力出逃仍有价值）
    # 盘中实时盯盘 IntradayMonitor 独立运行，不依赖此策略启用
    # - capital_flow_alert
    # v0.4.8 禁用：大样本回测不通过（v0.4.7 全市场 1710股 -0.46%/夏普-0.21/胜率38%）
    # 30股小样本 +5.82%/夏普0.24 通过是过拟合，100股/1710股均不通过
    # - pullback_low
    # v0.4.2 禁用：分阶段回测发现所有阶段夏普均为负
    # 牛市+3.36%但中位数-4.16%（靠极少数大牛股拉动均值），震荡+4.15%夏普0.09（边缘），熊市-0.70%夏普-0.50
    # 全市场均值+7.41% 仅靠极少数极端样本（如 002862 +54.95%）拉动，中位数始终接近0或负
    # - turtle
    # v0.4.2 禁用：全市场1792只×500天回测无效
    # - dual_ma              # 收益+0.53%/夏普-0.12/盈利比21%（金叉过严，多数股票0信号）
    # - money_flow_follow    # 收益+0.98%/夏普-0.23/盈利比33%（中位-4.55%）
    # - chen_jiangting       # 收益+0.60%/夏普-0.11/盈利比42%（中位-1.13%）
    # - leopard_three_factors  # 收益+0.59%/夏普-0.11/盈利比42%（与chen_jiangting实现高度重叠）
    # v0.4.2 禁用：小样本回测即无效（60天-0.61夏普 / 250天-0.12夏普，负收益）
    # - bollinger
    # v0.4.2 禁用：小样本回测即无效（60天-0.81夏普 / 250天-0.22夏普，负收益）
    # - rsi_reversal
  # 信号融合规则：unanimous（全票通过）/ majority（多数）/ any（任一）/ weighted（策略池加权）
  # v0.4.1：恢复 weighted（多策略共识），any 模式在 A 股高噪声下产生大量假信号
  signal_fusion: weighted
  min_confidence: 0.6            # 恢复 0.6，0.5 放宽后弱信号泛滥
  auto_select: true              # 启用自动选股（全市场扫描+策略信号+综合评分）
  select_top_n: 50               # 恢复 50，100 过大增加噪声
  select_max_candidates: 10      # 最大选股数量
  # v0.4.6: 豹哥三要素选股池过滤器（默认关闭）
  # 来源：豹哥战法 https://mp.weixin.qq.com/s/guNx28XZgrjSpPy2Ug6x7Q
  # 三要素是「选股池准入」非「择时信号」，默认关闭因为：
  # - 要求换手率≥15%（高度活跃），与 pullback_low/double_yin 缩量低吸逻辑冲突
  # - 适合与 box_breakout（突破追势）配合，趋势市手动开启 enabled: true
  leopard_universe_filter:
    enabled: false
    turnover_min: 15.0            # 换手率下限（%）
    amount_min: 1000000000       # 成交额下限（元，10亿）
    circ_mv_min: 7000000000     # 流通市值下限（元，70亿）

# ========== 筹码结构过滤 ==========
holder_concentration_filter:
  enabled: true
  quarterly_change_pct_threshold: 30.0
  monthly_change_pct_threshold: 15.0
  avg_hold_change_threshold: -20.0
  lurker_consecutive_quarters: 2
  lurker_total_decline_threshold: 20.0

# ========== 盘中实时盯盘 ==========
intraday_monitor:
  enabled: true
  performance_mode: auto    # auto|high|medium|low|off
  # 自定义监控范围（可选，留空则按性能模式自动决定）
  custom_watchlist: []
  # 告警阈值（单位：亿元 / %，与 DataManager 返回单位对齐）
  # P0-1 修复：原按元单位配置（100_000_000），但数据源已 /1e8 转为亿元
  alert_thresholds:
    super_large_inflow: 1.0          # 单股超大单净流入 1 亿
    super_large_outflow: 1.0         # 单股超大单净流出 1 亿
    main_pct_threshold: 5.0         # 主力净占比 5%（百分比单位）
    consecutive_days: 3              # 连续日数
    consecutive_total: 3.0           # 连续累计 3 亿
    industry_flow_threshold: 10.0    # 行业资金流 10 亿
    position_outflow_warning: 0.5    # 持仓股主力净流出 0.5 亿告警

# ========== 风控 ==========
risk:
  max_position_ratio: 0.30       # 单股仓位上限 30%
  daily_loss_warn: 0.03          # 日亏 3% 预警
  daily_loss_halt: 0.05          # 日亏 5% 熔断
  max_total_positions: 5         # 最大持仓数
  max_same_industry: 2           # 同行业最大持仓数
  # 涨跌停/停牌自动过滤（系统默认开启，不可关闭）
  t_plus_1: true                 # T+1 限制

# ========== 执行 ==========
execution:
  # 模式说明：
  #   signal_only - 只发信号通知，不下单（监控验证用）
  #   paper      - 模拟下单（纸面交易）
  #   live       - 实盘交易（需配置券商接口）
  mode: signal_only
  paper:
    initial_capital: 1000000     # 模拟本金 100 万
    commission_rate: 0.00025     # 佣金费率万2.5
    stamp_tax: 0.0005            # 印花税万5（卖出，2023-08-28 起减半，P1-b 修复）
    slippage: 0.002              # 滑点 0.2%
  live:
    broker: qmt
    confirm_required: true       # 下单前人工确认

# ========== 飞书通知 ==========
feishu:
  enabled: true
  # 消息类型开关
  notify_signal: true            # 买卖信号
  notify_daily_report: true      # 每日日报
  notify_risk_alert: true        # 风控告警
  notify_backtest: true          # 回测报告
  notify_system_error: true      # 系统异常
  # 推送时段（交易日）
  daily_report_times:
    - "09:10"
    - "11:35"
    - "15:10"

# ========== 调度 ==========
scheduler:
  timezone: Asia/Shanghai
  # 交易日才执行
  trading_days_only: true
  # 盘中扫描时刻（与 scheduler.py 的 SCAN_TIMES 对应）
  scan_times:
    - "09:30"   # 开盘扫描
    - "10:30"   # 上午中段
    - "13:05"   # 午盘开盘
    - "14:30"   # 尾盘
  # 任务开关：可单独关闭不需要的推送（true=启用，false=关闭）
  # 修改后需重启 scheduler 生效
  tasks:
    macro_morning: true        # 08:00 早间全球简报
    market_temp: true          # 08:25 市场温度计（博格估值温度）
    perspective_daily: true    # 08:30 十大视角日报
    signal_morning: true       # 09:10 盘前信号汇总
    macro_preamarket: true     # 09:15 盘前宏观简报
    scan_open: true            # 09:30 开盘扫描
    scan_mid_morning: true     # 10:30 盘中扫描
    signal_noon: true          # 11:35 午盘信号汇总
    macro_noon: true           # 11:40 午间宏观简报
    scan_afternoon: true       # 13:05 午盘扫描
    scan_close: true           # 14:30 尾盘扫描
    screener: true             # 14:30 尾盘选股
    flow_afternoon: true       # 14:30 盘后资金流决策报告
    signal_close: true         # 15:10 收盘信号汇总
    macro_close: true          # 15:15 收盘宏观简报
    fund_monitor: true         # 15:35 基金监控
    concept_daily: true        # 20:00 每日概念
    sentiment_daily: true      # 20:30 舆情日报
    weekly_optimize: true      # 周日 03:00 周参数优化
    weekly_review: true        # 周日 20:00 周复盘
    intraday_monitor: true     # 每分钟 盘中实时盯盘

# ========== 交易智慧 ==========
wisdom:
  skill_dir: "src/gugu/wisdom/skills"  # 项目内 skill 目录（优先）
  fallback_dirs:                       # 额外的 skill 目录（如本地 books2skill）
    - "_refs/books2skill/library/books/炒股的智慧/skills"
  skill_names:
    - stock-entry-decision
    - stock-stop-loss-decision
    - stock-position-sizing
    - stock-profit-taking-decision
    - stock-trailing-stop
    - stock-psychology-check
  # 仓颉蒸馏的28本书籍视角（多视角认知参考）
  books_dir: "src/gugu/wisdom/skills/books"
  enable_multi_perspective: false     # P0 修复：默认关闭，新手不需要利弗莫尔/格雷厄姆的权重裁决（专家审查发现这是"产品自我感动"）
  max_perspectives: 3                 # 每次决策最多参考的视角数


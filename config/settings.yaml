# gugu 交易系统主配置

# ========== 自选股 ==========
# 自选股列表（代码用字符串，前缀 0 容易被 YAML 解析为八进制，务必加引号）
watchlist:
  # 自选股（手动关注的股票）
  - "600519"   # 贵州茅台
  - "300750"   # 宁德时代
  - "000858"   # 五粮液
  - "601318"   # 中国平安
  - "000333"   # 美的集团
  # 注：auto_select=true 时，系统会在每次扫描中自动从全市场选股
  # 选出的候选股仅参与当次扫描，不会自动写入 watchlist

# ========== 数据源 ==========
data:
  primary_source: sina           # 主源：新浪（东方财富在部分网络被封）
  fallback_sources:              # 降级源
    - akshare
  fetch_interval_seconds: 120    # 实时采集间隔（秒）
  fail_threshold: 3              # 连续失败 N 次降级
  fail_cooldown_seconds: 300     # 降级冷却时间
  cache_ttl_seconds: 120         # 实时数据缓存
  history_db: sqlite:///data/gugu.db
  parquet_dir: data/parquet

# ========== 策略 ==========
strategy:
  # 启用的策略列表（v0.3.0：启用趋势+均值回归互补策略，weighted 融合）
  # 趋势跟踪（牛市/趋势市有效）：box_breakout, turtle, dual_ma
  # 均值回归（震荡市有效）：bollinger, rsi_reversal
  # 回测基准：box_breakout +30.02%, turtle +10.98%, dual_ma +2.98%
  # 注释掉的策略在回测中表现不佳，但可能与趋势策略形成低相关互补
  enabled:
    - box_breakout
    - turtle
    - dual_ma
    - bollinger
    - rsi_reversal
  # 信号融合规则：unanimous（全票通过）/ majority（多数）/ any（任一）/ weighted（策略池加权）
  signal_fusion: weighted
  min_confidence: 0.6            # 最低置信度阈值
  auto_select: true              # 启用自动选股（全市场扫描+策略信号+综合评分）
  select_top_n: 50               # 全市场按资金流排序取前 N
  select_max_candidates: 10      # 最大选股数量

# ========== 风控 ==========
risk:
  max_position_ratio: 0.30       # 单股仓位上限 30%
  daily_loss_warn: 0.03          # 日亏 3% 预警
  daily_loss_halt: 0.05          # 日亏 5% 熔断
  max_total_positions: 5         # 最大持仓数
  max_same_industry: 2           # 同行业最大持仓数
  # 涨跌停/停牌自动过滤（系统默认开启，不可关闭）
  t_plus_1: true                 # T+1 限制

# ========== 执行 ==========
execution:
  # 模式说明：
  #   signal_only - 只发信号通知，不下单（监控验证用）
  #   paper      - 模拟下单（纸面交易）
  #   live       - 实盘交易（需配置券商接口）
  mode: signal_only
  paper:
    initial_capital: 1000000     # 模拟本金 100 万
    commission_rate: 0.00025     # 佣金费率万2.5
    stamp_tax: 0.0005            # 印花税万5（卖出，2023-08-28 起减半，P1-b 修复）
    slippage: 0.002              # 滑点 0.2%
  live:
    broker: qmt
    confirm_required: true       # 下单前人工确认

# ========== 飞书通知 ==========
feishu:
  enabled: true
  # 消息类型开关
  notify_signal: true            # 买卖信号
  notify_daily_report: true      # 每日日报
  notify_risk_alert: true        # 风控告警
  notify_backtest: true          # 回测报告
  notify_system_error: true      # 系统异常
  # 推送时段（交易日）
  daily_report_times:
    - "09:10"
    - "11:35"
    - "15:10"

# ========== 调度 ==========
scheduler:
  timezone: Asia/Shanghai
  # 交易日才执行
  trading_days_only: true
  # 盘中扫描时刻（与 scheduler.py 的 SCAN_TIMES 对应）
  scan_times:
    - "09:30"   # 开盘扫描
    - "10:30"   # 上午中段
    - "13:05"   # 午盘开盘
    - "14:30"   # 尾盘

# ========== 交易智慧 ==========
wisdom:
  skill_dir: "src/gugu/wisdom/skills"  # 项目内 skill 目录（优先）
  fallback_dirs:                       # 额外的 skill 目录（如本地 books2skill）
    - "_refs/books2skill/library/books/炒股的智慧/skills"
  skill_names:
    - stock-entry-decision
    - stock-stop-loss-decision
    - stock-position-sizing
    - stock-profit-taking-decision
    - stock-trailing-stop
    - stock-psychology-check
  # 仓颉蒸馏的28本书籍视角（多视角认知参考）
  books_dir: "src/gugu/wisdom/skills/books"
  enable_multi_perspective: true      # 启用多视角书籍认知
  max_perspectives: 3                 # 每次决策最多参考的视角数

# ========== 基金监控 ==========
fund:
  enabled: true
  funds:
    - code: "001480"
      name: "财通成长优选混合A"
      cost_price: null    # 可选，配置后显示累计盈亏和止盈信号
      base_investment: 1000
    - code: "026211"
      name: "平安科技精选混合C"
      cost_price: null
      base_investment: 1000

# ========== 资金流日报 ==========
flow_report:
  enabled: true
  # 推送时段
  morning_time: "08:00"    # 盘前 — 昨日(T-1)资金流复盘
  close_time: "15:10"      # 收盘 — 今日资金流日报
  # 分析参数
  sector_top_n: 5
  stock_strong_top_n: 5

# ========== 基本面过滤 ==========
# 参数说明：
#   PE_MAX=60：A 股合理估值上限约 60 倍，超过此值泡沫风险显著上升
#   PB_MAX=8：除银行等特殊行业外，PB>8 已属偏高估值，需警惕
#   ROE_MIN=5：连 5% ROE 都没有的公司不具备长期投资价值
fundamental:
  pe_min: 0              # PE 下限（排除亏损股）
  pe_max: 60             # PE 上限（排除泡沫股，A 股合理估值上限）
  pb_min: 0              # PB 下限
  pb_max: 8              # PB 上限（除银行外 PB>8 已属偏高）
  roe_min: 5             # ROE 下限（%，连 5% 都没有的公司不具备投资价值）
  revenue_growth_min: -20  # 营收增长率下限（%，排除衰退股）

# ========== 日志 ==========
log:
  level: INFO
  dir: logs
  rotation: "10 MB"
  retention: "30 days"

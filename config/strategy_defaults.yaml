# 策略默认参数

turtle:
  # 海龟交易系统：趋势跟踪 + 突破 + ATR 动态止损
  breakout_window: 20  # 唐奇安通道突破窗口
  exit_window: 10  # 退出窗口
  atr_window: 20  # ATR 计算窗口
  risk_per_trade: 0.01  # 单笔风险占比 1%
  max_units: 4  # 最大加仓单元数

bollinger:
  # 布林带：触及下轨买入，触及上轨卖出
  window: 20
  num_std: 2.0  # 标准差倍数
  stop_loss_atr: 2.0  # ATR 止损倍数

dual_ma:
  # 双均线交叉：短均线上穿长均线买入，下穿卖出
  short_window: 5
  long_window: 20

box_breakout:
  # 达尔文箱体理论：箱体震荡突破为信号（v2 优化版）
  default_stock_pool: "603501,002371,002472,300033,002230"  # 突破类：活跃中小盘
  box_window: 15  # 箱体识别窗口
  volume_confirm: True  # 成交量确认（仅买入，卖出不需要）
  volume_ratio: 1.2  # 量比阈值
  confirm_days: 1                # 突破后需 1 根 K 线确认（防假突破）
  # v2 新增：趋势过滤 — 仅在上升趋势时允许买入
  trend_filter: True
  trend_mode: slope              # P2 优化：均线斜率模式（slope/crossover），响应更快
  trend_ma_short: 20              # 趋势短期均线
  trend_ma_long: 60               # 趋势长期均线（仅 crossover 模式使用）
  # v2 新增：最大持仓天数 — 超时强制卖出，防止资金被横盘股套牢
  max_hold_days: 30

rsi_reversal:
  # RSI 均值回归：超卖买入，超买卖出
  default_stock_pool: "300750,601012,600438,603259,002594"  # 均值回归：高波动趋势股
  window: 9
  oversold: 20  # 超卖阈值
  overbought: 65  # 超买阈值

macd:
  short_window: 12
  long_window: 26
  signal_window: 9

kdj:
  window: 9
  oversold: 25
  overbought: 75

dual_thrust:
  # Dual Thrust 突破
  lookback: 5
  k_up: 0.5
  k_down: 0.5

money_flow_follow:
  # 资金流跟随策略：混合模式（P1-11 重设计：原 5 AND 过严导致 32571 次回测 trades=0）
  # 必要条件 hard filter：3 均线多头 + 放量 + 收盘>MA20 + 非历史天量
  # 增强评分 soft score：4 均线 / 创新高 / 涨幅强势 / 缩量回踩（仅影响置信度）
  ma_periods: [5, 10, 20, 60]        # 多头排列均线周期
  new_high_window: 20  # 创新高回看窗口
  new_high_lookback: 60  # 历史新高回看长度（P0: 120→60 放宽）
  pullback_max_pct: 0.08  # 回踩最大幅度 8%（P0: 5%→8% 放宽）
  volume_shrink_days: 2  # 缩量回踩天数
  volume_expand_ratio: 1.2  # 放量确认量比阈值（P0: 1.5→1.2 放宽）
  abnormal_volume_ratio: 3.0  # 天量剔除阈值（3倍60日均量）
  recent_gain_window: 10             # 近期涨幅窗口
  recent_gain_threshold: 0.03  # 近期最低涨幅 3%（热点近似）
  vol_ma_window: 60                  # 成交量均线窗口

chen_jiangting:
  # 陈江挺《炒股的智慧》阻力突破策略
  resistance_window: 20  # 阻力位回看窗口（近20日最高价）
  volume_ratio: 1.5  # 量比阈值（当日量 >= N日均量的1.5倍）
  vol_ma_window: 20  # 成交量均线窗口
  ma_short: 20  # 短期均线（趋势判断 + 跌破卖出）
  ma_long: 60  # 长期均线（中期趋势过滤）
  max_daily_gain_pct: 0.07  # 阶段过滤：当日涨幅 >7% 视为疯狂阶段，不追

pullback_low:
  # 低吸回踩策略：震荡市专用
  ma_window: 20
  pullback_pct: 0.03
  vol_shrink_ratio: 0.8

double_yin:
  # 双阴钱袋子策略：主力洗盘拐点
  default_stock_pool: "300750,601012,600438,603259,000858"  # 均值回归：高波动趋势股
  ma_short: 5
  ma_long: 20
  yin_count: 2
  vol_shrink_ratio: 0.7
  support_window: 10

breakout_rebound:
  # v0.6.4: 大幅放宽条件以增加信号产量
  # 来源：陈学长不吃面交易策略

  # ── 均线参数 ──
  ma_trend_window: 20  # 默认不变
  ma_long_window: 60  # 默认不变
  ma_slope_window: 5  # 默认不变

  # ── 涨停筛选参数 ──
  limit_up_window: 10  # 涨停回看窗口（7日→10日）
  limit_up_threshold: 0.07  # 涨停判定阈值（9.5%→7%，覆盖更多涨停）

  # ── 护盘参数 ──
  support_tolerance: 0.12  # 护盘容忍度（±5%→±12%）

  # ── 趋势参数 ──
  trend_slope_window: 5  # 趋势斜率窗口
  trend_slope_threshold: -0.05  # 趋势斜率阈值（-0.01→-0.05）

  # ── 量能参数 ──
  volume_ratio: 0.85  # 缩量判断（0.7→0.85）
  volume_ratio_max: 1.5  # 量比上限

  # ── 洗盘参数 ──
  wash_window: 7  # 洗盘窗口（5日→7日）
  wash_drop_threshold: -0.01  # 洗盘跌幅阈值（-2%→-1%）
  wash_vol_threshold: 1.0  # 洗盘放量阈值（1.2→1.0）

  # ── 置信度参数 ──
  min_confidence: 0.3  # 置信度下限（0.5→0.3）

  # ── 止损参数 ──
  stop_loss_pct: 0.08  # 止损（5%→8%）
  take_profit_pct: 0.05  # 止盈（6%→5%）

  # ── 时间止损 ──
  time_stop_days: 10  # 时间止损天数（5天→10天）
  time_stop_gain_threshold: 0.01  # 时间止损阈值（3%→1%）

capital_flow_alert:
  # 资金流异动监控策略：4卖出特征识别主力出逃 + 3买入特征捕捉洗盘结束
  # 来源：豆包AI「龙头股散户化」分析 + 实战派资金流监控
  # 第一性原理：策略只用 OHLCV 近似资金流特征，真正的资金流判断在
  # SignalPipeline 步骤 2 由 MoneyFlowFilter 完成（保持策略无外部 IO）
  ma20_window: 20                     # 趋势均线（MA20，支撑/跌破判定）
  vol_ma_window: 5                    # 成交量均线窗口
  shrink_ratio: 0.8                   # 缩量回踩量比上限（主力洗盘结束）
  breakout_volume_ratio: 1.3          # 量价背离放量阈值
  stagnation_volume_ratio: 2.0        # 高位巨量滞涨量比阈值（主力出货）
  pullback_max_pct: -0.02             # 回踩涨幅下限 -2%
  recent_strong_window: 5             # 前期强势表现回看窗口
  recent_strong_threshold: 0.05       # 前期强势涨幅阈值 5%
  confirm_days: 0                    # 不确认（放量/缩量本身即触发条件）

breakout_rebound:

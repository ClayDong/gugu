# 策略默认参数

turtle:
  # 海龟交易系统：趋势跟踪 + 突破 + ATR 动态止损
  # 2026-08-01 参数对齐（代码=权威）：删 risk_per_trade/max_units（代码从未读取）
  breakout_window: 20  # 唐奇安通道突破窗口
  exit_window: 10  # 退出窗口
  atr_window: 20  # ATR 计算窗口
  volume_confirm: true  # 成交量确认（代码读取）
  vol_ratio: 1.5  # 量比阈值（代码读取）
bollinger:
  # 布林带：触及下轨买入，触及上轨卖出
  # 2026-08-01 参数对齐（代码=权威）：删 stop_loss_atr（代码从未读取）
  window: 20
  num_std: 2.0  # 标准差倍数
dual_ma:
  # 双均线交叉：短均线上穿长均线买入，下穿卖出
  short_window: 5
  long_window: 20

box_breakout:
  # 达尔文箱体理论：箱体震荡突破为信号（v2 优化版）
  default_stock_pool: "603501,002371,002472,300033,002230"  # 突破类：活跃中小盘
  box_window: 15  # 箱体识别窗口
  volume_confirm: True  # 成交量确认（仅买入，卖出不需要）
  volume_ratio: 1.2  # 量比阈值
  confirm_days: 1                # 突破后需 1 根 K 线确认（防假突破）
  # v2 新增：趋势过滤 — 仅在上升趋势时允许买入
  trend_filter: True
  trend_mode: slope              # P2 优化：均线斜率模式（slope/crossover），响应更快
  trend_ma_short: 20              # 趋势短期均线
  trend_ma_long: 60               # 趋势长期均线（仅 crossover 模式使用）
  # v2 新增：最大持仓天数 — 超时强制卖出，防止资金被横盘股套牢
  max_hold_days: 30

rsi_reversal:
  # RSI 均值回归：超卖买入，超买卖出
  default_stock_pool: "300750,601012,600438,603259,002594"  # 均值回归：高波动趋势股
  window: 9
  oversold: 20  # 超卖阈值
  overbought: 65  # 超买阈值

macd:
  short_window: 12
  long_window: 26
  signal_window: 9

kdj:
  window: 9
  oversold: 25
  overbought: 75

dual_thrust:
  # Dual Thrust 突破
  lookback: 5
  k_up: 0.5
  k_down: 0.5

money_flow_follow:
  # 资金流跟随策略：混合模式（P1-11 重设计：原 5 AND 过严导致 32571 次回测 trades=0）
  # 必要条件 hard filter：3 均线多头 + 放量 + 收盘>MA20 + 非历史天量
  # 增强评分 soft score：4 均线 / 创新高 / 涨幅强势 / 缩量回踩（仅影响置信度）
  ma_periods: [5, 10, 20, 60]        # 多头排列均线周期
  new_high_window: 20  # 创新高回看窗口
  new_high_lookback: 60  # 历史新高回看长度（P0: 120→60 放宽）
  pullback_max_pct: 0.08  # 回踩最大幅度 8%（P0: 5%→8% 放宽）
  volume_shrink_days: 2  # 缩量回踩天数
  volume_expand_ratio: 1.2  # 放量确认量比阈值（P0: 1.5→1.2 放宽）
  abnormal_volume_ratio: 3.0  # 天量剔除阈值（3倍60日均量）
  recent_gain_window: 10             # 近期涨幅窗口
  recent_gain_threshold: 0.03  # 近期最低涨幅 3%（热点近似）
  vol_ma_window: 60                  # 成交量均线窗口

chen_jiangting:
  # 陈江挺《炒股的智慧》阻力突破策略
  resistance_window: 20  # 阻力位回看窗口（近20日最高价）
  volume_ratio: 1.5  # 量比阈值（当日量 >= N日均量的1.5倍）
  vol_ma_window: 20  # 成交量均线窗口
  ma_short: 20  # 短期均线（趋势判断 + 跌破卖出）
  ma_long: 60  # 长期均线（中期趋势过滤）
  max_daily_gain_pct: 0.07  # 阶段过滤：当日涨幅 >7% 视为疯狂阶段，不追

pullback_low:
  # 低吸回踩策略：震荡市专用
  # 2026-08-01 参数对齐（代码=权威）：原 3 参数（ma_window/pullback_pct/vol_shrink_ratio）
  # 代码从未读取，整体替换为代码实际读取的 11 参数
  ma_short: 20
  ma_long: 60
  strong_window: 5  # 强势表现窗口
  strong_pct: 0.05  # 强势涨幅阈值
  pullback_min_pct: -0.02  # 回踩下限
  pullback_max_pct: 0.01  # 回踩上限
  vol_ratio_max: 1.0  # 回踩日量比上限
  stop_loss_pct: 0.03
  take_profit_window: 20  # 止盈窗口
  time_stop_window: 5  # 时间止损窗口
  time_stop_threshold: 0.02  # 时间止损阈值
double_yin:
  # 双阴钱袋子策略：主力洗盘拐点
  default_stock_pool: "300750,601012,600438,603259,000858"  # 均值回归：高波动趋势股
  # 2026-08-01 参数名对齐（代码=权威，原 ma_short/ma_long/yin_count/vol_shrink_ratio/support_window 代码从未读取）
  ma_trend_window: 20
  ma_long_window: 60
  ma_slope_window: 5
  second_yin_vol_ratio_max: 0.6
  first_yin_vol_ratio_max: 0.9
  breakout_vol_ratio_min: 2.0
  stop_loss_pct: 0.0          # 跌破MA20即止损
  take_profit_pct: 0.08
  max_upper_shadow_pct: 0.02
  stagnation_vol_ratio: 2.5
  doji_body_max: 0.01
  small_yang_max_gain: 0.03
  min_confidence: 0.0
breakout_rebound:
  # v0.6.4: 大幅放宽条件以增加信号产量
  # 来源：陈学长不吃面交易策略
  # 2026-08-01 参数对齐（代码=权威）：语义映射迁移调优值
  #   limit_up_window→limit_up_lookback, limit_up_threshold→limit_up_pct,
  #   volume_ratio→shrink_vol_ratio, volume_ratio_max→breakout_vol_ratio,
  #   wash_window→wash_day_max, time_stop_days→time_stop_window,
  #   time_stop_gain_threshold→time_stop_threshold
  #   删 support_tolerance/trend_slope_*/wash_drop_threshold/wash_vol_threshold（代码无对应）

  # ── 均线参数 ──
  ma_trend_window: 20
  ma_long_window: 60
  ma_slope_window: 5

  # ── 涨停筛选参数 ──
  limit_up_lookback: 10  # 涨停回看窗口（迁移自 limit_up_window，7日→10日）
  limit_up_pct: 0.07  # 涨停判定阈值（迁移自 limit_up_threshold，9.5%→7%）

  # ── 突破量能 ──
  breakout_vol_ratio: 1.5  # 突破放量倍数（迁移自 volume_ratio_max）
  shrink_vol_ratio: 0.85  # 缩量判断（迁移自 volume_ratio，0.7→0.85）

  # ── 洗盘参数 ──
  wash_day_max: 7  # 洗盘窗口（迁移自 wash_window，5日→7日）

  # ── 置信度参数 ──
  min_confidence: 0.3

  # ── 止损参数 ──
  stop_loss_pct: 0.08
  take_profit_pct: 0.05
  max_upper_shadow_pct: 0.04  # 上影线容忍
  stagnation_vol_ratio: 1.8  # 高位滞涨量比
  ground_vol_ratio: 0.5  # 地量确认

  # ── 时间止损 ──
  time_stop_window: 10  # 时间止损窗口（迁移自 time_stop_days，5天→10天）
  time_stop_threshold: 0.01  # 时间止损阈值（迁移自 time_stop_gain_threshold，3%→1%）
rebound_elite:
  # 断板反包·精英追涨策略（2026-07-31 事件研究验证后的概率化用法）
  # 只做「高活跃妖股 + 放量反包追涨」验证有效的形态，废弃护盘低吸(显著为负)
  # 验证：67股/2.5年/152事件，本形态子集5日+4.08%、10日+9.99%、盈亏比2.76
  lookback_days: 120           # 活跃度统计回看窗口
  min_limit_ups: 8             # 过去120日内涨停次数下限（活跃度/妖股过滤，验证规律）
  limit_up_pct: 0.095          # 涨停判定阈值（主板9.5%）
  wash_gap: 5                  # 首板后找洗盘大阴的最大间隔天数
  wash_min_drop: 0.03          # 洗盘阴线最小跌幅（-3%）
  wash_vol_min: 0.7            # 洗盘日量能 ≥ 首板量能的倍数下限
  support_tolerance: 0.03      # 护盘支撑容忍度（首板开盘价 ±3%）
  vol_ratio_min: 1.2           # 反包日放量阈值（量比≥1.2）
  stop_loss_pct: 0.08          # 破位止损（跌破首板开盘价×(1-8%)）
  max_hold_days: 10            # 时间止损/最大持仓天数

capital_flow_alert:
  # 资金流异动监控策略：4卖出特征识别主力出逃 + 3买入特征捕捉洗盘结束
  # 来源：豆包AI「龙头股散户化」分析 + 实战派资金流监控
  # 第一性原理：策略只用 OHLCV 近似资金流特征，真正的资金流判断在
  # SignalPipeline 步骤 2 由 MoneyFlowFilter 完成（保持策略无外部 IO）
  ma20_window: 20                     # 趋势均线（MA20，支撑/跌破判定）
  vol_ma_window: 5                    # 成交量均线窗口
  shrink_ratio: 0.8                   # 缩量回踩量比上限（主力洗盘结束）
  breakout_volume_ratio: 1.3          # 量价背离放量阈值
  stagnation_volume_ratio: 2.0        # 高位巨量滞涨量比阈值（主力出货）
  pullback_max_pct: -0.02             # 回踩涨幅下限 -2%
  recent_strong_window: 5             # 前期强势表现回看窗口
  recent_strong_threshold: 0.05       # 前期强势涨幅阈值 5%
  confirm_days: 0                    # 不确认（放量/缩量本身即触发条件）

industry_capital_momentum:
  # 行业资金强度 + 动量确认策略（v2.x 系列）
  # 来源：行业轮动 + 动量确认
  # 核心哲学：行业资金流入 + 动量确认 → 顺势而为
  # 2026-08-01 参数对齐（代码=权威）：语义映射
  #   rsi_oversold→rsi_low, rsi_overbought→rsi_high, score_threshold→min_entry_score
  #   删 ma_mid/momentum_*/volume_ma_window/trend_ma/trend_slope_window（代码未读）

  # ── 均线参数 ──
  ma_short: 5
  ma_long: 20

  # ── 量能参数 ──
  volume_ratio: 1.3

  # ── RSI参数 ──
  rsi_window: 14
  rsi_low: 45              # 超卖阈值（迁移自 rsi_oversold）
  rsi_high: 65             # 超买阈值（迁移自 rsi_overbought）

  # ── 评分参数 ──
  min_entry_score: 0.30    # 最小入场评分（迁移自 score_threshold）
  ma5_slope_threshold: 0.0  # MA5 斜率阈值
  return_hot_threshold: 0.20  # 热度收益阈值

  # ── 风控参数 ──
  stop_loss_pct: 0.10
  take_profit_pct: 0.12
  trailing_stop_pct: 0.03  # 移动止损
  trailing_start_pct: 0.05  # 移动止损启动阈值

  # ── 趋势过滤 ──
  exit_trend_ma: 10        # 退出趋势均线
  require_ma20_up: true    # 要求 MA20 上行

  # ── 持仓周期 ──
  min_hold_days: 8         # 最小持仓天数
  max_hold_days: 25        # 最大持仓天数

  # ── 信号确认 ──
  confirm_days: 0
ma5_momentum:
  # 5日均线动量策略：放量大阳线 + 回踩MA5
  # 来源：短线趋势跟踪
  # 2026-08-01 参数对齐（代码=权威）：删 ma_window/volume_ratio/pullback_pct
  # （v0.8.1 已补真实参数但未删旧死参数）
  default_stock_pool: "600519,300750,002594,002371"  # 动量类：趋势龙头
  stop_loss_pct: 0.03
  take_profit_pct: 0.06
  big_yang_gain_pct: 0.03       # 放量大阳线涨幅阈值（3%）
  big_yang_vol_ratio: 1.8       # 放量倍数（量/均量 >= 1.8）
  big_yang_lookback: 10         # 近 N 日内出现过放量大阳线
  pullback_tolerance: 0.02      # 回踩容忍度（收盘 >= MA5 * (1-2%)）
  shrink_vol_ratio: 0.7         # 缩量确认（回踩日量 <= 前均量 * 0.7）
  profit_deviation_pct: 0.05    # 偏离 MA5 止盈阈值（5%）
  ma5_break_exit_days: 3        # 连续 N 日跌破 MA5 清仓
  vol_ma_window: 5              # 量均线窗口
leopard_three_factors:
  # 豹子三因子策略：量价配合 + 均线支撑 + 动量确认
  # 2026-08-01 参数对齐（代码=权威）：删 momentum_window（代码从未读取）
  # 添加代码实际读取的 6 参数（原 defaults 缺失，调优写回从未生效）
  ma_short: 5
  ma_long: 20
  volume_ratio: 1.3
  turnover_threshold: 0.15  # 换手率阈值
  amount_threshold: 10000000000.0  # 成交额下限 100亿
  market_cap_threshold: 70000000000.0  # 市值上限 700亿
  breakout_window: 20  # 突破窗口
  vol_ma_window: 20  # 量均线窗口
  max_daily_gain_pct: 0.07  # 单日最大涨幅过滤
  stop_loss_pct: 0.05
  take_profit_pct: 0.10
first_board:
  # 首板战法（北京炒家）：首板套利 + 极致风控 + 机械执行
  # 来源：北京炒家首板战法
  # 2026-08-01 参数对齐（代码=权威）：删 ma_short/ma_long/volume_ratio/
  # limit_up_threshold/price_min/seal_ratio_min（代码从未读取）
  stop_loss_pct: 0.05
  take_profit_pct: 0.10
  max_hold_days: 3
  limit_up_pct: 0.095        # 涨停判定阈值（5%-11%）
  limit_up_lookback: 120     # 涨停回看窗口（交易日）
  history_limit_up_min: 3    # 历史涨停次数下限
  market_cap_min: 3000000000   # 流通市值下限 30 亿
  market_cap_max: 10000000000  # 流通市值上限 100 亿
  price_max: 20.0            # 股价上限
  turnover_min: 0.05         # 换手率下限 5%
  turnover_max: 0.15         # 换手率上限 15%
  vol_ratio_min: 2.0         # 量比下限
  vol_ratio_max: 3.0         # 量比上限
  time_stop_window: 1        # 时间止损窗口（交易日）
  confirm_days: 1            # 确认天数
  min_confidence: 0.0        # 置信度下限（代码默认 0.0）
dragon_tiger_short:
  # 短线龙虎榜反包跟随
  # 来源：龙虎榜游资行为分析
  # 2026-08-01 参数对齐（代码=权威）：删 ma_short/ma_long（代码从未读取），
  # volume_ratio→max_vol_ratio
  limit_up_lookback: 5  # 涨停回看窗口
  limit_up_pct: 0.095  # 涨停判定阈值
  max_vol_ratio: 2.0  # 量比上限（迁移自 volume_ratio）
  ma_trend_window: 20  # 趋势均线窗口
  ma_slope_window: 5  # 均线斜率窗口
  max_break_days: 3  # 断板最大天数
  stop_loss_pct: 0.05
  take_profit_pct: 0.08
  stagnation_vol_ratio: 2.5  # 高位滞涨量比
  max_upper_shadow_pct: 0.02  # 上影线容忍
  time_stop_window: 5  # 时间止损窗口
  time_stop_threshold: 0.03  # 时间止损阈值
  vol_ma_window: 20  # 量均线窗口
  min_confidence: 0.55  # 置信度下限
north_force_long:
  # 长线主力吸筹跟随
  # 来源：北向资金行为分析
  # 2026-08-01 参数对齐（代码=权威）：语义映射迁移
  #   ma_short→ma_trend_window, ma_long→ma_long_window,
  #   volume_ratio→max_vol_ratio, accumulation_window→recent_momentum_window
  ma_trend_window: 20  # 短期均线（迁移自 ma_short）
  ma_long_window: 60  # 长期均线（迁移自 ma_long）
  ma_slope_window: 5  # 均线斜率窗口
  pullback_to_ma_pct: 0.02  # 回踩均线容忍度
  recent_momentum_window: 20  # 近期动量窗口（迁移自 accumulation_window）
  recent_momentum_pct: 0.05  # 近期动量阈值
  recent_spike_window: 5  # 近期异动窗口
  recent_spike_pct: 0.05  # 近期异动涨幅阈值
  max_daily_gain_pct: 0.02  # 单日涨幅上限（吸筹期不追高）
  max_vol_ratio: 1.5  # 量比上限（迁移自 volume_ratio）
  vol_ma_window: 60  # 量均线窗口
  stop_loss_pct: 0.08
  take_profit_pct: 0.15
  stagnation_vol_ratio: 2.5  # 高位滞涨量比
  max_upper_shadow_pct: 0.03  # 上影线容忍
  time_stop_window: 30  # 时间止损窗口
  time_stop_threshold: 0.05  # 时间止损阈值
  min_confidence: 0.55  # 置信度下限
cloud_trend:
  # 云策略：三维趋势 + 两类入场 + 分层仓位
  # 来源：用户自研（趋势跟踪 + 共振确认 + 严格风控）
  # 核心哲学：只做上涨趋势，震荡/下跌空仓
  # 2026-08-01 参数对齐（代码=权威）：删 ma_mid（代码从未读取）

  # ── 均线参数 ──
  ma_short: 5
  ma_trend: 20

  # ── 三维趋势判定参数 ──
  hh_ll_window: 20
  hh_ll_compare: 5
  vol_compare_window: 10

  # ── 入场参数 ──
  breakout_vol_ratio: 1.5
  pullback_tolerance: 0.01
  doji_body_max: 0.01
  small_yang_max_gain: 0.03

  # ── 趋势阶段参数 ──
  trend_early_days: 5

  # ── 止损参数 ──
  stop_loss_pct: 0.02
  max_hold_days: 30
  trailing_stop_pct: 0.05
  time_stop_days: 15

  # ── 信号确认 ──
  confirm_days: 0
hot_money:
  # 游资策略：三数交易法 — 涨停筛选 + 缩倍量入场 + 放倍量离场
  # 来源：游资内部交易心法
  # 核心哲学：成交量是无法造假的大资金痕迹
  default_stock_pool: "002472,300033,002230,603501"  # 游资类：高换手活跃股

  # ── 涨停筛选参数 ──
  limit_up_window: 5
  limit_up_threshold: 0.095

  # ── 量能参数 ──
  shrink_ratio: 0.5
  expand_ratio: 2.0
  vol_ma_window: 20
  min_volume: 1000000

  # ── 半仓滚动参数 ──
  rolling_enabled: true
  rolling_yin_buy_ratio: 0.5
  rolling_yang_sell_ratio: 0.5

  # ── 风控参数 ──
  max_hold_days: 20
  max_track_days: 15
  hard_stop_loss_pct: 0.03
  trailing_stop_pct: 0.05

  # ── 双通道参数 ──
  big_yang_enabled: true

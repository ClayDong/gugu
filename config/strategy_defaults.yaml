# 策略默认参数

turtle:
  # 海龟交易系统：趋势跟踪 + 突破 + ATR 动态止损
  breakout_window: 20  # 唐奇安通道突破窗口
  exit_window: 10  # 退出窗口
  atr_window: 20  # ATR 计算窗口
  risk_per_trade: 0.01  # 单笔风险占比 1%
  max_units: 4  # 最大加仓单元数

bollinger:
  # 布林带：触及下轨买入，触及上轨卖出
  window: 20
  num_std: 2.0  # 标准差倍数
  stop_loss_atr: 2.0  # ATR 止损倍数

dual_ma:
  # 双均线交叉：短均线上穿长均线买入，下穿卖出
  short_window: 5
  long_window: 20

box_breakout:
  # 达尔文箱体理论：箱体震荡突破为信号（v2 优化版）
  box_window: 15  # 箱体识别窗口
  volume_confirm: True  # 成交量确认（仅买入，卖出不需要）
  volume_ratio: 1.2  # 量比阈值
  confirm_days: 1                # 突破后需 1 根 K 线确认（防假突破）
  # v2 新增：趋势过滤 — 仅在上升趋势时允许买入
  trend_filter: True
  trend_mode: slope              # P2 优化：均线斜率模式（slope/crossover），响应更快
  trend_ma_short: 20              # 趋势短期均线
  trend_ma_long: 60               # 趋势长期均线（仅 crossover 模式使用）
  # v2 新增：最大持仓天数 — 超时强制卖出，防止资金被横盘股套牢
  max_hold_days: 30

rsi_reversal:
  # RSI 均值回归：超卖买入，超买卖出
  window: 14
  oversold: 30  # 超卖阈值
  overbought: 70  # 超买阈值

macd:
  short_window: 12
  long_window: 26
  signal_window: 9

kdj:
  window: 9
  oversold: 20
  overbought: 80

dual_thrust:
  # Dual Thrust 突破
  lookback: 5
  k_up: 0.5
  k_down: 0.5

money_flow_follow:
  # 资金流跟随策略：混合模式（P1-11 重设计：原 5 AND 过严导致 32571 次回测 trades=0）
  # 必要条件 hard filter：3 均线多头 + 放量 + 收盘>MA20 + 非历史天量
  # 增强评分 soft score：4 均线 / 创新高 / 涨幅强势 / 缩量回踩（仅影响置信度）
  ma_periods: [5, 10, 20, 60]        # 多头排列均线周期
  new_high_window: 20  # 创新高回看窗口
  new_high_lookback: 60  # 历史新高回看长度（P0: 120→60 放宽）
  pullback_max_pct: 0.08  # 回踩最大幅度 8%（P0: 5%→8% 放宽）
  volume_shrink_days: 2  # 缩量回踩天数
  volume_expand_ratio: 1.2  # 放量确认量比阈值（P0: 1.5→1.2 放宽）
  abnormal_volume_ratio: 3.0  # 天量剔除阈值（3倍60日均量）
  recent_gain_window: 10             # 近期涨幅窗口
  recent_gain_threshold: 0.03  # 近期最低涨幅 3%（热点近似）
  vol_ma_window: 60                  # 成交量均线窗口

chen_jiangting:
  # 陈江挺《炒股的智慧》阻力突破策略
  resistance_window: 20  # 阻力位回看窗口（近20日最高价）
  volume_ratio: 1.5  # 量比阈值（当日量 >= N日均量的1.5倍）
  vol_ma_window: 20  # 成交量均线窗口
  ma_short: 20  # 短期均线（趋势判断 + 跌破卖出）
  ma_long: 60  # 长期均线（中期趋势过滤）
  max_daily_gain_pct: 0.07  # 阶段过滤：当日涨幅 >7% 视为疯狂阶段，不追
  divergence_vol_window: 5            # 量价背离判断窗口

leopard_three_factors:
  # 豹哥三要素策略：高流动性 + 大资金承载 + 放量突破
  # 来源：豹哥战法（换手率≥15% + 成交额≥10亿 + 流通市值≥70亿）
  breakout_window: 20                # 突破回看窗口（近N日最高价）
  volume_ratio: 1.5                  # 量比阈值（放量确认）
  vol_ma_window: 20                  # 成交量均线窗口
  ma_short: 20                       # 短期均线（趋势判断 + 跌破卖出）
  ma_long: 60                         # 长期均线（中期趋势过滤）
  max_daily_gain_pct: 0.07            # 非涨停过滤：当日涨幅 >7% 不追（避免追涨停买不到）
  amount_threshold: 1000000000       # 成交额阈值 10亿（豹哥三要素之一）
  turnover_threshold: 0.15           # 换手率阈值 15%（豹哥三要素之二）
  market_cap_threshold: 7000000000   # 流通市值阈值 70亿（豹哥三要素之三）

pullback_low:
  # 低吸回踩策略：缩量回踩不破 MA20（震荡市专用）
  # 来源：陈江挺《炒股的智慧》"回调不破支撑才买" + 尾盘选股器实战逻辑
  # 与 box_breakout 互补：牛市用突破，震荡市用低吸
  ma_short: 20                        # 短期均线（支撑位）
  ma_long: 60                         # 长期均线（中期趋势过滤）
  strong_window: 5                    # 前 N 日内有强势表现的窗口
  strong_pct: 0.05                    # 强势涨幅阈值 5%
  pullback_min_pct: -0.02            # 回踩涨幅下限 -2%
  pullback_max_pct: 0.01             # 回踩涨幅上限 +1%
  vol_ratio_max: 1.0                 # 量比上限（缩量确认）
  stop_loss_pct: 0.03                # 止损百分比（跌破 MA20 × 0.97）
  take_profit_window: 20             # 前高回看窗口（止盈目标位）
  time_stop_window: 5                # 时间止损窗口（持仓 N 日无进展）
  time_stop_threshold: 0.02          # 时间止损阈值（涨幅 < 2% 减半仓）

double_yin:
  # 双阴钱袋子策略：主力洗盘结束 + 倍量反转确认（波段拐点信号）
  # 来源：实战派「双阴钱袋子」战法（微信公众号文章深度整理）
  # 与 pullback_low 互补：pullback_low 单K低吸，本策略 3K 组合拐点确认
  # 架构：4核心硬AND（趋势+双阴+支撑+反转K线）+ 5评分项置信度 + 次日倍量加仓

  # ── 均线参数 ──
  ma_trend_window: 20                 # 趋势均线（MA20）
  ma_long_window: 60                  # 长期均线（MA60）
  ma_slope_window: 5                  # MA20 斜率计算窗口（持续向上拐头判定）

  # ── 双阴量能配合（评分项，非硬性门槛）──
  first_yin_vol_ratio_max: 0.9       # 第一根阴量比上限（小幅缩量，评分用）
  second_yin_vol_ratio_max: 0.6      # 第二根阴量比上限（极致缩量，评分用）

  # ── 反转K线参数 ──
  doji_body_max: 0.01                # 十字星实体阈值（body < 1%）
  small_yang_max_gain: 0.03          # 小阳线最大涨幅 3%

  # ── 倍量反转加仓（次日独立买入信号）──
  breakout_vol_ratio_min: 2.0        # 倍量反转量比下限（2倍量红柱）
  breakout_pct_min: 0.0              # 倍量阳线涨幅下限（收复双阴失地）

  # ── 置信度过滤 ──
  min_confidence: 0.0                # 核心信号置信度下限（0=不过滤，用评分仅作置信度展示）

  # ── 止损止盈 ──
  stop_loss_pct: 0.0                 # 止损百分比（0=跌破MA20即止损，盘中刺破收回可持有）
  take_profit_pct: 0.08              # 止盈位 8%（减半仓触发阈值 × 0.6 = 4.8%）
  max_upper_shadow_pct: 0.02        # 长上影阈值（高位滞涨判定）
  stagnation_vol_ratio: 2.5          # 巨量滞涨量比阈值（清仓信号）

capital_flow_alert:
  # 资金流异动监控策略：4卖出特征识别主力出逃 + 3买入特征捕捉洗盘结束
  # 来源：豆包AI「龙头股散户化」分析 + 实战派资金流监控
  # 第一性原理：策略只用 OHLCV 近似资金流特征，真正的资金流判断在
  # SignalPipeline 步骤 2 由 MoneyFlowFilter 完成（保持策略无外部 IO）
  ma20_window: 20                     # 趋势均线（MA20，支撑/跌破判定）
  vol_ma_window: 5                    # 成交量均线窗口
  shrink_ratio: 0.8                   # 缩量回踩量比上限（主力洗盘结束）
  breakout_volume_ratio: 1.3          # 量价背离放量阈值
  stagnation_volume_ratio: 2.0        # 高位巨量滞涨量比阈值（主力出货）
  pullback_max_pct: -0.02             # 回踩涨幅下限 -2%
  recent_strong_window: 5             # 前期强势表现回看窗口
  recent_strong_threshold: 0.05       # 前期强势涨幅阈值 5%
  confirm_days: 0                    # 不确认（放量/缩量本身即触发条件）

breakout_rebound:
  # 断板反包策略：涨停板断裂后主力反包介入的短线信号
  # 来源：A股实战派「断板反包」战法（短线主力行为学）
  # 第一性原理：涨停(主力介入) → 断板(洗盘) → 反包(再介入) 完整行为闭环
  # 与 double_yin 互补：double_yin 是波段拐点，本策略是短线主力行为

  # ── 均线参数 ──
  ma_trend_window: 20                 # 趋势均线（MA20）
  ma_long_window: 60                  # 长期均线（MA60，中期趋势过滤）
  ma_slope_window: 5                  # MA20 斜率计算窗口（持续向上拐头判定）

  # ── 涨停板识别 ──
  limit_up_pct: 0.095                 # 涨停判定阈值 9.5%（A股10%涨停板留0.5%容差）
  limit_up_lookback: 5                # 涨停板回看窗口（前N日内有涨停）

  # ── 反包量能确认 ──
  breakout_vol_ratio: 1.5             # 反包日量比下限（放量确认）

  # ── 置信度过滤 ──
  min_confidence: 0.0                 # 核心信号置信度下限（0=不过滤，用评分仅作置信度展示）

  # ── 止损止盈 ──
  stop_loss_pct: 0.03                 # 止损百分比（反包日最低价 × 0.97）
  take_profit_pct: 0.08              # 止盈位 8%（减半仓触发阈值 × 0.6 = 4.8%）
  max_upper_shadow_pct: 0.02        # 长上影阈值（高位滞涨判定）
  stagnation_vol_ratio: 2.5          # 巨量滞涨量比阈值（清仓信号）

  # ── 时间止损 ──
  time_stop_window: 5                # 时间止损窗口（持仓 N 日）
  time_stop_threshold: 0.03           # 时间止损阈值（涨幅 < 3% 减仓）

  # ── 信号确认 ──
  confirm_days: 0                    # 不确认（反包突破本身即触发条件）

north_force_long:
  # 长线主力吸筹跟随策略：趋势向上 + 缩量回踩 MA20 + 近期有资金关注
  ma_trend_window: 20
  ma_long_window: 60
  ma_slope_window: 5
  pullback_to_ma_pct: 0.02
  recent_momentum_window: 20
  recent_momentum_pct: 0.05
  recent_spike_window: 5
  recent_spike_pct: 0.05
  max_daily_gain_pct: 0.02
  max_vol_ratio: 1.5
  vol_ma_window: 60
  stop_loss_pct: 0.07
  take_profit_pct: 0.20
  stagnation_vol_ratio: 2.5
  max_upper_shadow_pct: 0.03
  time_stop_window: 30
  time_stop_threshold: 0.05
  min_confidence: 0.55

dragon_tiger_short:
  # 短线龙虎榜反包跟随策略：涨停 + 断板 + 反包 + 趋势支撑
  ma_trend_window: 20
  ma_slope_window: 5
  limit_up_pct: 0.095
  limit_up_lookback: 5
  max_break_days: 3
  stop_loss_pct: 0.05
  take_profit_pct: 0.10
  stagnation_vol_ratio: 2.5
  max_upper_shadow_pct: 0.02
  time_stop_window: 5
  time_stop_threshold: 0.03
  max_vol_ratio: 2.0
  vol_ma_window: 20
  min_confidence: 0.55

huamulan_fake_dip:
  # 早盘假摔低吸战法：捕捉主力洗盘
  # 适用场景：个股上升趋势中的正常回调
  # 来源：视频16（2026-07-04《记住这个信号，不亏！》）
  # v0.8.0 重构：忠实原文核心3条件（长下影线 + 收红 + 缩量）
  # v0.8.0 参数校准（40只×600日事件研究，383事件）：
  #   ❌ 原参数(下影3%+缩量1.0×) → 5日-0.80% 不显著
  #   ✅ 校准参数(下影2%+缩量0.8×) → 5日+1.17% p=0.024 / 10日+1.89% p=0.015
  #   ✅ 加市场过滤(沪深300站上20日线) → 10日+2.85% p=0.015，2026弱市也转正
  #   ⚠️ 必须配合 bull/rally 市场过滤，弱市(2026)不交易

  # ── 假摔参数（v0.8.0 校准） ──
  lower_shadow_min_pct: 0.02  # 下影线最小长度2%（校准自3%：2%+严格缩量显著为正，3%/4%为负）
  vol_shrink_ratio: 0.8  # 缩量比例0.8×（校准自1.0×：越严格越好，0.8显著优于1.0/1.2）
  vol_ma_window: 5  # 量能均线窗口（对应原文"最近5天"）

  # ── 风控参数 ──
  stop_loss_pct: 0.05  # 止损5%（"百分之五射直损"纪律，基准=信号日收盘价）
  time_stop_window: 10  # 时间止损10日（校准自5日：10日持有 p=0.015 最显著）
  time_stop_threshold: 0.02  # 时间止损阈值2%


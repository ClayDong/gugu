    notes: "核心逻辑：主力\"一步洗到位\"后护盘不破位，说明志存高远，反包即买点。\n适用市场：主板（不做创业板，上下40cm波动逻辑不同）。\n适用市值：50-150亿（太大吃情绪、太小被量化操控）。\n\
      适用标的：热门题材、有辨识度、历史涨停活跃。\n\n选股6条件：\n  1. 位置：相对低位或中途（长时间横盘后首板，或上涨后回调到一半位置首板）\n\
      \  2. 首板：缩量首板（量不能太大，说明抛压小、高度控盘），跳空首板更优\n  3. 洗盘：首板后必须接放量大阴线（量越大越好、砸得越深越好）\n\
      \  4. 护盘：不破首板开盘价/缺口/5日/10日/20日线（主力成本底线）\n  5. 方向：热门题材、有辨识度、历史涨停多（老妖股优先）\n  6.\
      \ 市值价格：不做ST/创业板，市值50-150亿，股价>3元\n\n买点3个：\n  买点1：护盘阶段缩量回踩支撑位（首板开盘价/缺口/20日线附近）\n\
      \  买点2：底背离（价创新低、MACD不创新低、缩量）\n  买点3：有效放量后回踩（第一次上冲成交额达流通市值0.5%）\n\n卖点5个：\n  卖点1：反包成功→至少减仓一半（\"\
      6厘米够了兄弟\"）\n  卖点2：顶背离（价创新高、MACD不创新高、缩量）\n  卖点3：量价背离（价格创新高但成交额没有同步放大）\n  卖点4：破位止损（护盘阶段破位且没有收回）\n\
      \  卖点5：不及预期（买入后第二天绿开/无拉升）\n\n仓位管理：\n  分批建仓（4-6成仓位分批介入）+ 做T降成本 + 安全底线优先 + 不贪心不恋战\n\
      \n关键量化参数：\n  首板上板成交额 = 流通市值1%\n  断板反包上板成交额 = 流通市值1.5%-2%\n  有效放量 = 流通市值0.5%\n\
      \  缩量判断 = 前一天量50%以内\n  无量判断 = 前一天量10%-30%\n  健康成交额范围 = 流通市值1%-1.5%\n  倍量危险信号\
      \ = 流通市值2%以上\n  洗盘观察天数 = 3天（三破三收）\n\n架构：护盘状态（洗盘后1-3日）+ 趋势过滤（MA20向上）+ 三买点OR +\
      \ 6评分项置信度。\n评分项：洗盘充分度0.20 + 护盘强度0.20 + 买入信号类型0.25 + 趋势共振0.15 + 时效性0.10 + 量能配合0.10。\n\
      卖出：持仓状态判断 + 止损1（入场点low×0.97）+ 止损2（MA20）+\n      止盈1（4.8%大阳线）+ 止盈2（巨量滞涨）+ 时间止损（5天<3%）+\n\
      \      顶背离 + 量价背离 + 连续下跌（不及预期）。\n\n与 double_yin 根本差异：\n  double_yin 是上涨中途双阴洗盘（趋势中继），\n\
      \  breakout_rebound 是涨停后断板反包（短线主力行为分析）。\n\n历史回测记录：\n  v0.5.8 全市场100股×500天：收益-1.71%/夏普-0.28/胜率10.1%/盈利比11%/持仓2.7天\n\
      \  诊断10股：买入信号13个/卖出信号7个（卖出泛滥已解决，2640→7）\n  4项解锁条件评估：❌样本外Sharpe>0 ❌参数稳定性≥50%\
      \ ✅最大回撤<25% ❌收益≥0\n\nv0.6.2 重构内容（陈学长不吃面完整版）：\n  1. 新增洗盘识别：首板后放量大阴线（跌幅>3%且量比>1.5）\n\
      \  2. 新增护盘判断：支撑位 = max(首板开盘价, MA20)，不破或破位收回\n  3. 新增买点1：护盘阶段缩量回踩支撑位\n  4. 新增买点2：MACD底背离（价创新低、MACD不创新低、缩量）\n\
      \  5. 新增买点3：有效放量后回踩（前几日有放量，今日缩量回踩）\n  6. 新增卖点2：MACD顶背离（价创新高、MACD不创新高）\n  7.\
      \ 新增卖点3：量价背离（价格创新高但量能萎缩）\n  8. 新增卖点5：不及预期（连续2日下跌>2%）\n  9. 新增MACD指标计算（用于背离判断）\n\
      \  10. 新增MA5/MA10均线系统（更精细的支撑判断）\n遵循硬约束：策略未通过回测验证，保持禁用直到调优后重新通过4项解锁条件。\n"

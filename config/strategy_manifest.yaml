  weekly_combo:
    name: 周线四因子共振选股
    module: gugu.strategies.weekly_combo
    class: WeeklyComboStrategy
    source: 经典周线选股法则（倍量+金叉+回踩+三连阳）
    enabled: false
    archived: true
    summary: 将日K转周K后执行四因子共振评分：倍量因子(30%)+MACD金叉(30%)+回踩20周均线(25%)+周线三连阳(15%)，综合评分≥0.5产生买入信号
    params_entry: strategy_defaults.yaml
    validation: v0.7.5 多股聚合回测未通过（平均收益-1.99%/夏普-1.22），暂不启用
    notes: |
      核心哲学：周线级别信号比日线更稳定，主力资金难以伪造周线量价痕迹。

      四因子心法：
      1. 周线放出倍量（30%）：周成交量≥前一周2倍，主力大举进场信号
      2. 周线MACD金叉（30%）：周线级别金叉上涨周期持续2-3月，大资金战略布局
      3. 回踩20周均线（25%）：20周线是主力持仓成本线，回调缩量是低吸机会
      4. 周线三连阳（15%）：连续三根抬高阳线+温和放量，主升浪前热身

      评分机制：
      - 满足因子数量 × 权重 = 综合评分（0-1）
      - 评分 ≥ 0.5 产生买入信号
      - 置信度 = 综合评分（clip 0-1）

      风险管理（v0.7.5 新增）：
      - 动态止损：跌破入场价8%强制卖出
      - 移动止盈：盈利15%后启用，从最高价回撤10%止盈
      - 市场状态过滤：仅在 bull/rally 市场启用

      适用市场状态：牛市/反弹期（趋势明确时效果最佳）

      v0.7.5 多股聚合回测结果（13只股票×500交易日）：
      - 版本A（严格参数）：平均收益-1.99%，夏普-1.22，最大回撤7.73%，盈利比31%
      - 版本B（放宽参数）：平均收益-5.38%，夏普-1.14，最大回撤12.46%，盈利比23%
      - 结论：严格参数过滤低质量信号效果更好，策略适合高置信度入场

      回测未通过原因分析：
      1. 回测期（500交易日≈2年）覆盖震荡/下跌市，策略设计为牛市/反弹市有效
      2. 四因子共振条件苛刻，在震荡市难以同时满足多个因子
      3. 周线信号频率低，13只股票仅产生有限交易机会
      4. 参数放宽后交易增加但质量下降（版本B验证）

      后续优化方向：
      1. 等待牛市环境再启用（策略逻辑本身无问题，002371+15.77%证明有效）
      2. 结合十大视角分析，仅在基本面优质股上启用
      3. 可考虑与 RegimeDetector 联动，自动禁用震荡市
    validation_gate:

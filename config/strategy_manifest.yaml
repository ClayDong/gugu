  price_volume_signal:
    name: 换手率+量比尾盘黄金信号
    module: gugu.strategies.price_volume
    class: PriceVolumeSignalStrategy
    source: 短视频《尾盘半小时的黄金信号：换手率与量比实战指南》+ gugu-strategy-backtest 大样本回测
    enabled: true
    summary: 高换手(>5%)+温和放量(量比2-5)或低位放量吸筹 → 5日裸持有短线动量；高位放量派发出场。捕捉A股短期动量
    params_entry: strategy_defaults.yaml
    validation: 已完成大样本回测验证（27股+71股两轮）+ 2026-08-01 样本外检验：验证期10日超额+6.06%(p=0.020)但依赖单股sh688068(16/57信号)，去掉后p=0.193不显著；5只触发股全为科创板，样本偏差大
      → 证据不足，保持 experimental 观察
    notes: '核心逻辑：识别主力动向的关键不是复杂技术指标，而是换手率(筹码交换频率) + 量比(新鲜资金进场)。

      四信号框架： 1. 启动: 换手>5%, 量比2~3 → 主力布局，进场 2. 加速: 换手5-10%, 量比3~5 → 行情加速，果断跟上 3. 高位/低位:
      换手>10%, 量比>5 → 低位吸筹(跟进)/高位派发(离场) 4. 虚假繁荣: 换手>5%, 量比<2 → 无新资金，离场

      回测验证（腾讯源 600日 + 71股跨行业 80+信号 + bootstrap）： - 入场最优: 换手>5% 且(量比2~5 或 低位放量吸筹)，5日均收益+13.85%、胜率82%
      - 最优持有5-10日；bootstrap 95%CI下限>0，超额alpha +7.57~13.23%，统计显著非随机 - 反直觉: 裸持有5-10日
      > 主动止盈/止损（提前止盈砍掉大盈利，止损割掉洗盘） - 蓝筹负对照(茅台/四大行等)几乎不触发 → 适用边界=活跃题材/中小盘(换手中位>1.5%)
      - 定位: 选股入场漏斗(稀有事件)，非全自动交易系统

      工程注意： - 换手率用 amount/(close×float_shares)，float_shares 需按股票配置（腾讯实时流通市值） - 依赖
      tencent_collector 的 amount 单位修正（科创板×1/主板×100） '
    validation_gate:
      gate_category: trend
      status: in_review
      sample: 71 只跨行业股票 + 蓝筹负对照，600 交易日
      metrics:
        total_trades: 84
        avg_return: 0.083
        avg_sharpe: 0.0
        max_drawdown: 0.0
        profitable_ratio: 0.73
        param_stability: 0.8
        paper_signals: 0
        paper_return: 0.0
      next_action: paper 模式观察 30+ 真实信号后转 verified

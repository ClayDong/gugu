# 策略注册中心 — 全量策略清单
#
# 统一管理项目中所有策略资产（信号生成型、风控择时型、止盈止损型、Skill 型）。
# 每个策略包含元数据：出处、模块路径、启用状态、参数入口、验证状态。
#
# 用途：
# 1. 策略盘点：一条命令查看所有策略状态
# 2. 参数集中管理：风控参数从类属性迁移到此
# 3. 验证追踪：记录每个策略的回测/生产验证状态
# 4. 飞书看板：一键推送策略全景到飞书

# ============================================================
# 一、信号生成型策略（strategies/，走 _REGISTRY + SignalRouter）
# ============================================================
signal_strategies:
  box_breakout:
    name: 达尔文箱体突破
    module: gugu.strategies.breakout
    class: BoxBreakoutStrategy
    source: 达尔文《箱体理论》
    enabled: true
    summary: 识别箱体上下沿，突破上沿买入、跌破下沿卖出，配合成交量确认
    params_entry: strategy_defaults.yaml
    validation: 生产运行
    notes: confirm_days=1 防假突破

  turtle:
    name: 海龟交易法则
    module: gugu.strategies.trend
    class: TurtleStrategy
    source: 《海龟交易法则》唐奇安通道
    enabled: false
    summary: 通道突破买入，跌破 exit_low 卖出，ATR 动态止损 + 量比确认
    params_entry: strategy_defaults.yaml
    validation: v0.4.2 禁用（分阶段回测夏普均为负）

  dual_ma:
    name: 双均线交叉
    module: gugu.strategies.trend
    class: DualMAStrategy
    source: 经典技术分析
    enabled: false
    summary: 短均线上穿长均线买入、下穿卖出
    params_entry: strategy_defaults.yaml
    validation: v0.4.2 禁用（全市场回测收益+0.53%/夏普-0.12）

  bollinger:
    name: 布林带均值回归
    module: gugu.strategies.mean_revert
    class: BollingerStrategy
    source: 约翰·布林格《布林带》
    enabled: false
    summary: 触及下轨买入、触及上轨卖出
    params_entry: strategy_defaults.yaml
    validation: v0.4.2 禁用（全市场回测无效）

  rsi_reversal:
    name: RSI 均值回归
    module: gugu.strategies.mean_revert
    class: RSIStrategy
    source: 威尔斯·威尔德 RSI 指标
    enabled: false
    summary: RSI 离开超卖区买入、离开超买区卖出
    params_entry: strategy_defaults.yaml
    validation: v0.4.2 禁用（全市场回测无效）

  macd:
    name: MACD 金叉死叉
    module: gugu.strategies.trend
    class: MACDStrategy
    source: 利弗莫尔"安坐不动"+ MACD 指标
    enabled: false
    summary: 金叉买、死叉卖，附加顶/底背离检测
    params_entry: strategy_defaults.yaml
    validation: 回测不佳（低相关互补备选）
    notes: 与趋势策略相关性低，可互补

  kdj:
    name: KDJ 指标
    module: gugu.strategies.mean_revert
    class: KDJStrategy
    source: 乔治·莱恩 KDJ 指标
    enabled: false
    summary: K 在超卖区金叉 D 买入、超买区死叉卖出
    params_entry: strategy_defaults.yaml
    validation: 回测不佳

  dual_thrust:
    name: Dual Thrust 突破
    module: gugu.strategies.breakout
    class: DualThrustStrategy
    source: 《Dual Thrust》期货经典策略
    enabled: false
    summary: N 日 HH-LC/HC-LL 计算上下轨，开盘价 ± k 系数触发
    params_entry: strategy_defaults.yaml
    validation: 待验证
    notes: 跳过 confirm_days（信号当天即成立）

  money_flow_follow:
    name: 资金流跟随
    module: gugu.strategies.money_flow_follow
    class: MoneyFlowFollowStrategy
    source: 实战笔记（跟随资金强度 + 创新高回踩 + 放量确认）
    enabled: false
    summary: 5步复盘流程：热点涨幅 + 均线多头排列 + 非天量 + 创新高回踩不破MA20 + 缩量后放量确认
    params_entry: strategy_defaults.yaml
    validation: v0.4.2 禁用（全市场回测收益+0.98%/夏普-0.23/中位-4.55%）
    notes: |
      核心观点：板块行情中跟随资金强度，拒绝滞涨股补涨幻想。
      买点选择创历史新高（主力消化套牢盘），缩量回踩后放量确认入场。
      卖出：MA5 下穿 MA10 或跌破 MA20。confirm_days=0（放量确认本身即触发条件）。

  chen_jiangting:
    name: 陈江挺阻力突破
    module: gugu.strategies.chen_jiangting
    class: ChenJiangtingStrategy
    source: 《炒股的智慧》陈江挺
    enabled: false
    summary: 阻力突破 + 量能确认 + 阶段过滤（不追疯狂段），与 money_flow_follow 互补
    params_entry: strategy_defaults.yaml
    validation: v0.4.2 禁用（全市场回测收益+0.60%/夏普-0.11/中位-1.13%）
    notes: |
      核心观点：股价突破前期阻力 + 成交量放大 = 主力愿意消化套牢盘。
      不要求回踩（与 money_flow_follow 区别），直接突破即进场。
      阶段过滤：排除当日涨幅 >7% 的"疯狂"阶段。
      卖出：跌破 MA20 或量价背离（价格创新高但量萎缩）。

  leopard_three_factors:
    name: 豹哥三要素选股（已禁用，改为选股池过滤器）
    module: gugu.strategies.leopard_three_factors
    class: LeopardThreeFactorsStrategy
    source: 豹哥战法（微信公众号文章 https://mp.weixin.qq.com/s/guNx28XZgrjSpPy2Ug6x7Q）
    enabled: false
    summary: 已禁用。三要素本身是选股池准入，不产生 alpha，绑定放量突破后回测无效（v0.4.2 禁用）
    params_entry: strategy_defaults.yaml
    validation: v0.4.2 全市场回测无效（收益+0.59%/夏普-0.11/盈利比42%）已禁用
    notes: |
      v0.4.6 重新定位：三要素是「选股池准入」非「择时信号」（文章原文理念）。
      正确用法：作为 StockSelector 的前置预筛器（leopard_universe_filter），
      而非与放量突破绑定的完整策略。
      文章原文：三要素层层筛选（5000+ → 165 → 104 → 86 只），帮助新手缩小范围。
      三要素本身不解决"何时买"，只解决"在哪选"。
      新实现见 filters/leopard_universe.py（LeopardUniverseFilter），
      默认关闭，仅与 box_breakout（突破追势）配合时手动开启。
      原策略保留供历史参考，不建议重新启用。

  pullback_low:
    name: 低吸回踩
    module: gugu.strategies.pullback_low
    class: PullbackLowStrategy
    source: 《炒股的智慧》陈江挺"回调不破支撑才买" + 尾盘选股器实战逻辑
    enabled: false
    summary: 缩量回踩不破 MA20 的低吸策略（震荡市专用），与 box_breakout 互补
    params_entry: strategy_defaults.yaml
    validation: v0.4.8 禁用（大样本回测不通过）
    notes: |
      核心观点：牛市用 box_breakout 突破追势，震荡市用 pullback_low 缩量低吸。
      买入条件：当日涨幅 -2%~+1% + 量比 < 1.0 + 收盘价 ≥ MA20 + 前 5 日内有涨幅 ≥ 5% 强势表现。
      卖出：跌破 MA20×0.97 止损 + 前高止盈 + 5 日时间止损。
      验证结果（样本规模递增）：
        30 股：+5.82%/夏普0.24/胜率47%（v0.4.4 首次验证通过，4 项解锁条件全满足）
        100 股：-0.73%/夏普-0.33/胜率39%（v0.4.4 扩大后不稳定）
        1710 股：-0.46%/夏普-0.21/胜率38%（v0.4.7 全市场大样本不通过）
      结论：30 股小样本通过是过拟合，100 股/1710 股均不通过，v0.4.8 起禁用。
      与 double_yin 的关系：double_yin 大样本 +2.65%/夏普0.01 仍为正，保留启用。

  double_yin:
    name: 双阴钱袋子
    module: gugu.strategies.double_yin
    class: DoubleYinMoneyBagStrategy
    source: 实战派「双阴钱袋子」战法（微信公众号文章深度整理）
    enabled: true
    summary: 主力洗盘结束 + 倍量反转确认的波段拐点信号（3K 组合确认）
    params_entry: strategy_defaults.yaml
    validation: v0.4.5 多股聚合回测（2-3 项解锁条件通过）
    notes: |
      核心观点：主力洗盘闭环 = 缩阴洗盘 → 倍量红拉升，散户割肉完毕后主力锁仓启动。
      与 pullback_low 根本差异：pullback_low 单K低吸，本策略 3K 组合拐点确认。
      架构：4 核心硬 AND（趋势+双阴+支撑+反转K线）+ 5 评分项置信度 + 次日倍量加仓信号。
      两个入场点分离：钱袋子日（核心信号）+ 倍量反转日（次日加仓）。
      卖出：跌破 MA20 止损 + 大阳线 4.8% 止盈 + 巨量滞涨清仓。
      验证结果：30 股 +3.11%/50 股 +3.90% 夏普0.03/100 股 +2.81% 夏普-0.02，收益稳定为正。
      依赖 MarketFilter 在熊市拦截，与 pullback_low 互补。

  capital_flow_alert:
    name: 资金流异动监控
    module: gugu.strategies.capital_flow_alert
    class: CapitalFlowAlertStrategy
    source: 豆包AI「龙头股散户化」分析 + 实战派资金流监控
    # v0.5.0 禁用：100股回测 -1.42%/夏普-0.47/胜率26.6%，未通过验证
    # 策略代码保留作为卖出信号库，盘中 IntradayMonitor 独立运行不依赖此策略启用
    enabled: false
    summary: 4卖出特征识别主力出逃 + 3买入特征捕捉洗盘结束
    params_entry: strategy_defaults.yaml
    validation: v0.5.0 单元测试通过，待回测验证
    notes: |
      核心观点：资金出逃早于股价大跌，4 特征同时出现 = 主力撤离。
      卖出：放量下跌 + 量价背离 + 跌破MA20 + 巨量滞涨
      买入：缩量回踩不破MA20 + MA20向上 + 前期强势
      第一性原理：策略只用 OHLCV 近似资金流特征，真正的资金流判断在
      SignalPipeline 步骤 2 由 MoneyFlowFilter 完成（保持策略无外部 IO）。

  breakout_rebound:
    name: 断板反包
    module: gugu.strategies.breakout_rebound
    class: BreakoutReboundStrategy
    source: A股实战派「断板反包」战法（短线主力行为学）
    enabled: false
    summary: 涨停板断裂后主力反包介入的短线信号（涨停+断板+反包行为闭环）
    params_entry: strategy_defaults.yaml
    validation: v0.5.8 单元测试通过，全市场回测未通过（4项解锁条件3项失败），保持禁用
    notes: |
      核心观点：涨停=主力强势介入，断板=主力洗盘，反包=主力再介入。
      完整行为闭环：封板（介入）→ 断板（洗盘）→ 反包（再介入）。
      与 double_yin 根本差异：double_yin 是上涨中途双阴洗盘（趋势中继），
      breakout_rebound 是涨停后断板反包（短线主力行为分析）。
      架构：5 核心硬 AND（涨停+断板+反包+阳线+趋势）+ 5 评分项置信度。
      评分项：断板日缩量0.25 + 反包日量能强化0.30 + 强反包0.20 + 趋势0.15 + 时效0.10。
      卖出：持仓状态判断 + 止损1（入场点low×0.97）+ 止损2（MA20）+
            止盈1（4.8%大阳线）+ 止盈2（巨量滞涨）+ 时间止损（5天<3%）。
      v0.5.7 全链路回测结果（2026-07-08）：
        全市场100股×500天：收益-0.31%/夏普-0.07/胜率3.8%/盈利比5%
        分阶段回测（200股×3阶段）：
          牛市(184段)：收益-0.22%/夏普-0.08/盈利比3% ✗
          熊市(172段)：收益-0.02%/夏普-0.01/盈利比0% ✗
          震荡市(197段)：收益+0.09%/夏普+0.02/盈利比2% ?
        诊断10股：买入信号15个/卖出信号2640个（卖出泛滥根因）
      v0.5.8 调优内容：
        1. 量能确认拆分：is_yang 保留为硬AND（反包语义），vol_ratio 降级为评分项（+0.30）
        2. 引入 in_position（持仓状态）：所有卖出条件仅在持仓窗口（time_stop_window×4）内生效
        3. 止损1 改为基于入场点 low（ffill 追踪），止损2 恢复原阈值 close < ma_trend（仅在持仓状态）
        4. 止盈1 恢复原阈值 4.8%（take_profit_pct*0.6），仅在持仓状态判断
        5. 新增时间止损：持仓超 time_stop_window 天 + 涨幅 < time_stop_threshold
      v0.5.8 全链路回测结果（2026-07-08）：
        全市场100股×500天：收益-1.71%/夏普-0.28/胜率10.1%/盈利比11%/持仓2.7天
        分阶段回测（200股×3阶段）：
          牛市(184段)：收益-1.45%/夏普-0.34/盈利比11% ✗
          熊市(172段)：收益-0.15%/夏普-0.12/盈利比1% ✗
          震荡市(197段)：收益+0.80%/夏普+0.01/盈利比9% ?
        诊断10股：买入信号13个/卖出信号7个（卖出泛滥已解决，2640→7）
      v0.5.8 vs v0.5.7 改善：
        ✓ 卖出信号从 2640 降到 7（持仓状态判断，减少 99.7%）
        ✓ 胜率从 3.8% 提升到 10.1%（2.7倍提升）
        ✓ 盈利比从 5% 提升到 11%（2.2倍提升）
        ✓ 震荡市收益从 +0.09% 改善到 +0.80%（8.9倍提升）
        ✗ 牛市收益从 -0.22% 恶化到 -1.45%（时间止损导致频繁止损）
        ✗ 整体收益仍为负（-1.71%），策略不产生 alpha
      4项解锁条件评估：
        ❌ 样本外Sharpe>0：实际-0.28（牛市-0.34，震荡+0.01）
        ❌ 参数稳定性≥50%：未跑WF优化
        ✅ 最大回撤<25%：实际3.56%
        ❌ 收益≥0：实际-1.71%
      结论：
        1. 卖出信号泛滥问题已解决（2640→7），但策略本身不产生 alpha
        2. 断板反包形态在当前市场环境下无法持续盈利
        3. 可能原因：涨停板后断板可能是主力出货而非洗盘，反包可能是假突破诱多
        4. 策略保持禁用，需更强的主力资金确认机制才能考虑启用
      遵循硬约束：策略未通过回测验证，保持禁用直到调优后重新通过4项解锁条件。

# ============================================================
# 二、风控/择时型策略（analysis/ + engine/，SignalPipeline 直接实例化）
# ============================================================
risk_strategies:
  trailing_stop:
    name: 浪谷递进移动止损
    module: gugu.analysis.trailing_stop
    class: TrailingStopEngine
    source: 《炒股的智慧》陈江挺
    enabled: true
    summary: 止损随浪谷上移（只能上不能下），跌破浪谷 1/2/3 次递进警报
    params_entry: manifest（见下方 params）
    validation: 生产运行
    params:
      initial_stop_pct: 0.08       # 初始止损 8%
      atr_multiplier: 3.0          # ATR 倍数
      wave_window: 5                # 浪谷窗口
      max_drawdown_stop_pct: 0.15   # 最大回撤止损 15%
      tighten_factor: 0.5           # 危险信号收紧因子

  danger_signal:
    name: 三大危险信号检测
    module: gugu.analysis.danger_signal
    class: DangerSignalDetector
    source: 《炒股的智慧》陈江挺
    enabled: true
    summary: 量增价不涨、两天转头、坏消息（跳空低开/大跌）
    params_entry: 类属性（待迁移）
    validation: 生产运行

  no_average_down:
    name: 绝不向下摊平
    module: gugu.analysis.no_average_down
    class: NoAverageDownChecker
    source: 陈江挺/利弗莫尔/海龟共识
    enabled: true
    summary: 持仓亏损 > 2% 拒绝加仓，累计最大浮亏 > 5% 强制拒绝
    params_entry: manifest（见下方 params）
    validation: 生产运行
    params:
      loss_threshold: 0.02          # 持仓亏损阈值
      max_drawdown_threshold: 0.05  # 累计最大浮亏阈值

  stage_detector:
    name: 四阶段检测器
    module: gugu.analysis.stage_detector
    class: StageDetector
    source: 《炒股的智慧》四阶段理论
    enabled: true
    summary: 牛皮/正常升势/疯狂/最后四阶段分类
    params_entry: 类属性（待迁移）
    validation: 生产运行

  regime_detector:
    name: 多周期择时
    module: gugu.analysis.regime_detector
    class: MultiPeriodRegimeDetector
    source: 专业交易员多周期框架
    enabled: true
    summary: 周线 40% + 日线 40% + 短期 20% 加权评分
    params_entry: 类属性（待迁移）
    validation: 生产运行

  divergence_detector:
    name: 量价背离检测
    module: gugu.detectors.divergence_detector
    class: DivergenceDetector
    source: 《炒股的智慧》量价背离/天量滞涨
    enabled: true
    summary: 价格创新高但成交量萎缩 → 卖出预警
    params_entry: 类属性（待迁移）
    validation: 生产运行

  strategy_pool:
    name: 策略池动态加权
    module: gugu.analysis.strategy_pool
    class: StrategyPool
    source: qlib TopkDropoutStrategy
    enabled: true
    summary: 胜率 > 60% 加权 +20%，< 30% 降权 -30%，连亏 5 次禁用
    params_entry: 类属性（待迁移）
    validation: 生产运行

  regime_strategy_adjuster:
    name: 市场状态自适应权重调整
    module: gugu.analysis.regime_strategy_adjuster
    class: 函数模块（compute_regime_weights）
    source: 自研（P3 优化）
    enabled: true
    summary: 按市场状态（牛/熊/震荡/暴跌/反弹）动态调整趋势/均值回归/突破策略权重
    params_entry: manifest（见下方 params）
    validation: 单元测试通过，2026-07-02
    params:
      bull_trend_multiplier: 1.5
      bull_mean_revert_multiplier: 0.7
      sideways_trend_multiplier: 0.5
      sideways_mean_revert_multiplier: 1.5
      crash_trend_multiplier: 0.2
      crash_breakout_multiplier: 0.1

  dynamic_take_profit:
    name: 财叔动态止盈减仓
    module: gugu.analysis.dynamic_take_profit
    class: DynamicTakeProfitEngine
    source: 财叔实战经验
    enabled: true
    summary: +30% 减 1/3 → 每 +15% 减 10% → 大跌减半
    params_entry: manifest（见下方 params）
    validation: 单元测试通过，待生产验证
    params:
      first_take_profit_threshold: 0.30
      first_reduce_ratio: 0.333
      step_threshold: 0.15
      step_reduce_ratio: 0.10
      big_drop_threshold: -0.05
      big_drop_reduce_ratio: 0.50


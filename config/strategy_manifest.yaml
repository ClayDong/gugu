signal_strategies:
  cloud_trend:
    name: 云策略（三维趋势+两类入场+分层仓位）
    module: gugu.strategies.cloud_trend
    class: CloudTrendStrategy
    source: 用户自研（趋势跟踪+共振确认+严格风控）
    enabled: false
    archived: true
    summary: 三维趋势判定（均线多头+高低点抬升+量价配合）→ 两类入场（回踩低吸/放量突破）→ 分层仓位（初期4成/确认6-7成/末期2成）→ 严格止损（单笔≤2%/跌破MA20清仓）
    params_entry: strategy_defaults.yaml
    validation: Walk-Forward 未通过 2026-07-26 - 样本外 Sharpe ≤ 0; 参数稳定性 <50%; 平均样本外收益
      < 0
    notes: '核心哲学：只做上涨趋势，震荡/下跌空仓。三维共振缺一不可。

      低吸买点：回踩MA10/MA20 + 收阳/十字星 + 三维全满足（双阴后企稳加强）

      突破买点：放量突破20日高点 + 至少二维满足

      止损：单笔亏损≤总资金2% + 跌破MA20清仓，绝不扛单

      仓位：趋势初期4成、确认6-7成、末期2成，禁止梭哈逆势补仓

      '
    validation_gate:
      status: pending
      sample: 6 只蓝筹股，500 交易日
      metrics:
        total_trades: 2
        avg_return: 0.0
        avg_sharpe: 0.0
        max_drawdown: 0.0
        profitable_ratio: 0.0
        param_stability: 1.0
        paper_signals: 0
        paper_return: 0.0
      next_action: 需在牛市中验证（当前回测期震荡/下跌为主，策略设计为只做上涨趋势）
  hot_money:
    name: 游资策略（三数交易法）
    module: gugu.strategies.hot_money
    class: HotMoneyStrategy
    source: 游资内部交易心法（涨停筛选+缩倍量入场+放倍量离场）
    enabled: false
    archived: true
    # 2026-08-01 样本外证伪：15股×600日事件研究（510信号）全样本超额+1.00%(p=0.014)，
    # 但 sh688041 单股占36%信号；剔除后验证期(2025-02~2026-07)超额5d -0.50%/10d -0.77% 转负，
    # 2025(-0.43%)/2026(-0.85%)逐年恶化。训练期有效验证期失效 = 过拟合特征，集中度超标不可信。
    # 代码保留，禁止参与信号融合；若加"单股信号占比上限/板块分散约束"后重走 Walk-Forward 方可恢复。
    summary: 三步法：①近7日涨停筛选 → ②缩量至涨停日50%以下入场（筹码锁定） → ③放量至涨停日200%以上离场（主力出货）。进阶：半仓滚动（阴线买/阳线卖）增厚收益。
    params_entry: strategy_defaults.yaml
    # P0-5 修复：修正验证标签不一致（原 validation 写"通过"但 validation_gate.status=pending）
    # 2026-08-01 升级：15股×600日 Walk-Forward 事件研究 → 集中股依赖+样本外失效，降级 backtest_failed
    validation: backtest_failed 2026-08-01 - 510信号事件研究：全样本超额显著(+1.00% p=0.014)但依赖单股sh688041(36%)；剔除后验证期超额-0.77%(p=0.140)转负，2025/2026逐年恶化，过拟合特征
    notes: '核心哲学：成交量是唯一无法造假的大资金痕迹。

      涨停 = 主力态度最强信号（愿意用涨停价吃货 = 强烈看多）

      缩量 = 不坚定筹码已被清洗，主力仍在场内 → 入场时机

      放量 = 主力可能在出货，风险增加 → 离场时机

      半仓滚动 = 底仓吃趋势 + 滚动仓吃波动，鱼和熊掌兼得

      一句话：找7天内涨停，进场找缩倍量，离场找放倍量

      '
    validation_gate:
      status: backtest_failed
      sample: 15 只活跃题材股，600 交易日（事件研究，2024-02~2026-07，510信号）
      metrics:
        total_trades: 510
        avg_return: 0.0085
        avg_sharpe: 0.0
        max_drawdown: 0.0
        profitable_ratio: 0.0
        param_stability: 0.0
        paper_signals: 0
        paper_return: 0.0
      next_action: 降级禁用。优化方向：单股信号占比上限(剔除>30%集中股)/板块分散约束/市场环境过滤后重走 Walk-Forward 样本外验证，验证期超额显著为正(p<0.05)方可恢复

  asset_combo:
    name: 认知资产组合验证策略（risk_rules 五条组件 + regime 过滤）
    module: gugu.strategies.asset_combo
    class: AssetComboStrategy
    source: 首板入场 + risk_rules 五条认知资产 + HS300 regime 过滤（三层架构验证载体）
    enabled: false
    archived: true
    summary: 涨停首板入场 + entry_gap_filter(0-3%开盘溢价) + regime_filter(弱势期入场) + support_break_stop(破位止损) + detect_lock_profit_days(板上减半)。非独立盈利策略，Sharpe全负；gap+regime 弱势可作为风控工具嵌入其他策略
    params_entry: strategy_defaults.yaml
    validation: conditional_pass（2026-08-15 三轮验证：512只主板500d 事件研究 WF 5d +0.82%/p=0.36；持仓回测595只 A组合+0.31%/Sharpe-37.84/B +0.57%/-37.99/D +0.76%/-0.93。真alpha来源=弱势+gap过滤，破位止损=回撤控制，板上减半=无效，位置/活跃度=幸存者偏差）
    notes: '三层架构验证载体（STRATEGY_LIFECYCLE.md）。六条认知资产审计最终真值表（2026-08-15）：

      count_limit_ups 活跃度：无效（90d幸存者偏差）

      position_percentile 位置：负贡献（滤掉高位趋势股）

      entry_gap_filter 开盘溢价：减亏核心（5日改善+0.67%/10日+2.37%）

      apply_support_break_stop 破位止损：回撤控制工具（改善max_dd 5.68%，但降收益+0.31%→+0.76%）

      detect_lock_profit_days 板上减半：无效（大样本与时间止损无区别）

      regime 弱势过滤：唯一alpha来源（弱势期+gap +1.92% p=0.07；强势期-1.08% p=0.007 显著亏）

      关键教训：陈学长"牛市战法"完全反了——是弱势反弹期战法；真alpha不在K线形态，在「市场环境×入场时机」二维过滤。
      三条被证伪的旧结论：活跃度=唯一正因子(90d幸存者偏差)→gap=alpha(500d事件研究)→持仓Sharpe全负(持仓回测审判)。
      建议用法：entry_gap_filter + regime_filter 作为其他策略的入场前风控组件。
      '
    validation_gate:
      status: conditional_pass
      sample: 512只主板×500d 事件研究 + 595只×250+d 持仓回测
      metrics:
        total_trades: 242（WF） / 1105（持仓回测）
        avg_excess_5d: 0.0082
        p_value_5d: 0.36
        avg_return: 0.0031（A组合持仓回测）
        avg_sharpe: -37.84（A组合）/ -0.93（D组合仅时间止损）
        max_drawdown: -7.19%（A组合）/ -12.87%（D组合）
        profitable_ratio: 0.223（A组合）
      next_action: 不启用；提取 gap_max=0.03 + regime 弱势过滤作为「风控组件」嵌入其他 conditional_pass 策略的入场校验
  fanbao:
    name: 小圈圈儿《反包策略》V2.0 完整版（5+1战法）
    module: gugu.strategies.fanbao_strategy
    class: FanbaoStrategy
    source: 小圈圈儿《反包策略》广东经济出版社，2025年6月，原书完整修正版 V2.0
    enabled: false  # V2.0 重构完成，待全市场回测验证
    archived: true
    summary: 5+1战法：①跌停板战法（高位/低位连板跌停次日高开）②炸板反包（涨停→炸板→>6%→次日高开）③一字涨停板反包（一字板断板整理后高开）④反包回调战法（有反包基因的股票回调企稳再进）⑤跳空涨停式反包（跳空缺口涨停断板后高开）+⑥暴力洗盘（主流题材急跌次日高开）。统一进场信号=次日高开。含情绪周期/风险红线/性价比评分
    params_entry: strategy_defaults.yaml
    # 2026-08-15 升级到 V2.0 原书完整修正版：
    # 原有2种战法 → 扩展为5+1种战法
    # 新增：6条风险红线、7阶段情绪周期、性价比评分、统一高开进场信号
    # 对应文档：docs/validation/反包策略执行框架V2.0.md
    # 注意：当前只实现了代码逻辑，尚未回测验证
    validation_gate:
      status: pending
      sample: 0 只股票，0 个交易日（V2.0 重构未回测）
      metrics:
        total_trades: 0
        avg_return: 0.0
        avg_sharpe: 0.0
        max_drawdown: 0.0
        profitable_ratio: 0.0
        param_stability: 0.0
        paper_signals: 0
        paper_return: 0.0
      next_action: V2.0 已实现，需做全市场回测验证后评估是否启用。5+1战法各自独立，建议先验证炸板反包（模式二）再做全量
    notes: 'V2.0 原书完整修正版（2026-08-15）。
      5+1 战法：

      ① 跌停板战法（极端反包）：涨停→断板→跌停→次日高开买。
         分类：高位（连板≥2，市值≥50亿，性价比=市值×连板高度）
               低位（仅一板断后跌停，条件可适当放宽）
         核心：连板高度越高越好，市值越大越好。

      ② 炸板反包（新手首选）：涨停→炸板(盘中打开未封)→收盘≥6%→次日高开买。
         条件：市值≥50亿，炸板日高开，炸板日高位收盘。

      ③ 一字涨停板反包：一字板→断板整理→高开放量买。
         排除：第3/4板才出现一字加速（已高位）。
         位置要求：年线附近或底部。

      ④ 反包回调战法：有"反包基因"（历史涨停→断板→反包）的股票
         → 回调3-10天→出现企稳阳星→再次高开放量买。
         回调幅度不超过5%。

      ⑤ 跳空涨停式反包：跳空高开涨停（开盘>昨日最高）→一板断→高开买。
         大市值=资金合力强劲。

      +⑥ 暴力洗盘战法：涨停后→急速下跌(>7%)→次日高开买。
         条件：主流题材+热门股+大市值暴跌更能确认是洗盘。

      通用规则：
      - 风险红线6条（ST/立案/低价/低市值/阴跌/退潮题材）
      - 情绪周期7阶段（只做启动-发酵-主升）
      - 通用前置条件（市值≥50亿/位置低位/题材热度≥3次涨停）
      - 统一进场信号=次日高开（原书核心：跌停当天不能潜伏）
      - 性价比评分：市值分(0-40)+连板高度分(0-40)+题材分(0-20)
      '

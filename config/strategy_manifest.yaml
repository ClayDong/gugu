      \n选股标准（8条）：\n  1. 时间要求：只做上午10:30之前封死涨停的个股，优先9:30-10:00快速封板\n  2. 市值与价格：流通市值30-100亿，股价<20元，非机构重仓股\n\
      \  3. 题材与板块效应：当日同概念至少3只涨停，优先新题材/先锋股\n  4. 封单质量：封单金额 > 当日成交额的20%，封单稳定不频繁撤单\n\
      \  5. 换手率：5%-15%，排除缩量秒板与爆量烂板\n  6. 技术形态：股价处于历史低位或中期调整末端，突破关键压力位\n  7. 股性筛选：过去1年内至少3次涨停且次日平均溢价>2%\n\
      \  8. 排除项：ST股、次新股、一字板、公告利好板、高位股、下降趋势板\n\n买入规则：\n  - 买入时机：涨停封单瞬间挂单（排板为主，扫板为辅）\n\
      \  - 回封板优先：股票涨停后打开、再次回封时买入\n  - 单票仓位：≤10%（极端行情≤5%），每日持仓3-5只\n\n卖出规则（隔日卖出）：\n\
      \  - 高开≥3%：集合竞价卖一半，剩余观察10分钟，不冲板则清仓\n  - 高开≥5%但板块效应低：卖出50%，剩余10:30前不封板则出货\n \
      \ - 低开>2%：开盘3分钟内无条件止损\n  - 低开≤2%：观察15分钟，无法翻红则清仓\n  - 二连板可继续持有，开板必走\n\n仓位管理与风控（生命线）：\n\
      \  - 分仓规则：70万以下1-2仓≤50%，70-500万2-4仓≤15%，500-2000万4-8仓≤10%，2000万+8仓+≤5%\n  -\
      \ 硬性停盘：单日总亏损≥2% → 停手3天；月回撤>10% → 当月空仓\n  - 其他风控：永不满仓、坚决不用杠杆、封板率<80%降仓位、弱市空仓\n\

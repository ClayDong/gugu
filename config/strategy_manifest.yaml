  double_yin:
    name: 双阴钱袋子
    module: gugu.strategies.double_yin
    class: DoubleYinMoneyBagStrategy
    source: 实战派「双阴钱袋子」战法（微信公众号文章深度整理）
    enabled: true  # 2026-08-15 从 verified 降级 experimental（Sharpe -0.02/param_stability 0.4），保留信号观察
    summary: 主力洗盘结束 + 倍量反转确认的波段拐点信号（3K 组合确认）
    params_entry: strategy_defaults.yaml
    validation: Walk-Forward 未通过 2026-07-26 - 样本外 Sharpe ≤ 0
    notes: '核心观点：主力洗盘闭环 = 缩阴洗盘 → 倍量红拉升，散户割肉完毕后主力锁仓启动。

      与 pullback_low 根本差异：pullback_low 单K低吸，本策略 3K 组合拐点确认。

      架构：4 核心硬 AND（趋势+双阴+支撑+反转K线）+ 5 评分项置信度 + 次日倍量加仓信号。

      两个入场点分离：钱袋子日（核心信号）+ 倍量反转日（次日加仓）。

      卖出：跌破 MA20 止损 + 大阳线 4.8% 止盈 + 巨量滞涨清仓。

      验证结果：30 股 +3.11%/50 股 +3.90% 夏普0.03/100 股 +2.81% 夏普-0.02，收益稳定为正。

      依赖 MarketFilter 在熊市拦截，与 pullback_low 互补。

      '
    validation_gate:
      status: conditional_pass
      sample: 100 股多股聚合回测
      metrics:
        total_trades: 80
        avg_return: 0.028
        avg_sharpe: -0.02
        max_drawdown: 0.22

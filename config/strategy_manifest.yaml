    notes: "核心逻辑：主力\"一步洗到位\"后护盘不破位，说明志存高远，反包即买点。\n适用市场：主板（不做创业板，上下40cm波动逻辑不同）。\n适用市值：50-150亿（太大吃情绪、太小被量化操控）。\n\
      适用标的：热门题材、有辨识度、历史涨停活跃。\n\n选股6条件：\n  1. 位置：相对低位或中途（长时间横盘后首板，或上涨后回调到一半位置首板）\n\

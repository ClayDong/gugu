      \  信号3：基本面恶化（行业景气度下行/护城河被打破→清仓）\n  信号4：技术面走坏（跌破MA60且MA60拐头向下/顶部形态+放量下跌）\n  信号5：发现更好机会（低估程度大50%以上可换股）\n\
      \n仓位管理：\n  - 单只股票上限：不超过总仓位20%\n  - 行业集中度：单一行业不超过总仓位40%\n  - 分档建仓：第一档30%（买点信号）→\
      \ 第二档30%（跌破成本10-15%）→ 第三档20%（超卖信号）→ 剩余20%备用\n  - 轮动退出：疯狂阶段减至50%以下 / 恐慌阶段加至80%以上\
      \ / 横盘震荡保持60-80%\n\n量化阈值速查：\n  PE：极度低估<15 / 合理偏低15-20 / 合理偏高20-25 / 偏高≥25\n\
      \  PB：抄底<1.0 / 合理偏低1.0-1.5 / 偏高≥2.0\n  股息率：极佳>6% / 良好4%-6% / 不足<2%\n  筹码集中度：高度集中<15%\
      \ / 中度集中15%-25% / 分散>30%\n\n适用市场状态：牛市/反弹/震荡市（熊市/暴跌空仓）\n"

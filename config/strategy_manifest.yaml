      \ + 量比 < 1.0 + 收盘价 ≥ MA20 + 前 5 日内有涨幅 ≥ 5% 强势表现。\n卖出：跌破 MA20×0.97 止损 + 前高止盈\
      \ + 5 日时间止损。\n验证结果（样本规模递增）：\n  30 股：+5.82%/夏普0.24/胜率47%（v0.4.4 首次验证通过，4 项解锁条件全满足）\n\

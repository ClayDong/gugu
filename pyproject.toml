[project]
name = "gugu"
version = "0.6.0"
description = "Automated A-share signal monitoring system with multi-perspective analysis, risk control, and Feishu notification"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.12.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "loguru>=0.7",
    "httpx>=0.27",
    "tenacity>=8.0",
    "chinese-calendar>=1.9",
    "pyarrow>=15.0",
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    # 知识库 Agent：BM25 检索 + 中文分词 + docx 解析（轻量，无 PyTorch 依赖）
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "python-docx>=1.1.0",
    "scipy>=1.17.1",
    # v0.5.0 盘中实时盯盘：性能自适应检测 CPU 核数和内存
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gugu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/gugu --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "T10", "RUF"]
ignore = ["E501", "SIM108", "SIM115", "RUF001", "RUF002", "RUF003", "RUF012", "RUF034"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ALL"]  # 测试文件允许所有规则例外
"scripts/*" = ["ALL"]  # 脚本文件允许所有规则例外
"src/gugu/notifier/flow_report.py" = ["E402"]  # 运行时惰性导入，避免循环导入
"src/gugu/strategies/registry.py" = ["F821"]  # Any type arg, pre-existing
"src/gugu/web/app.py" = ["E402"]  # FastAPI startup import pattern

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

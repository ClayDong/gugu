[project]
name = "gugu"
version = "0.6.0"
description = "Automated A-share signal monitoring system with multi-perspective analysis, risk control, and Feishu notification"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.12.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "loguru>=0.7",
    "httpx>=0.27",
    "tenacity>=8.0",
    "chinese-calendar>=1.9",
    "pyarrow>=15.0",
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    # 知识库 Agent：BM25 检索 + 中文分词 + docx 解析（轻量，无 PyTorch 依赖）
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "python-docx>=1.1.0",
    "scipy>=1.17.1",
    # v0.5.0 盘中实时盯盘：性能自适应检测 CPU 核数和内存
    "psutil>=5.9",
    # v0.7.0 Alpha 生成：因子 IC 分析 + LightGBM 多因子模型
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gugu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/gugu --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",       # 基础错误
    "I",                   # import 排序
    "N",                   # pep8-naming
    "UP",                  # pyupgrade
    "B", "B9",            # bugbear（常见 bug 模式）
    "C4",                  # comprehensions
    "SIM",                 # simplify
    "T10",                 # debugger 检测
    "PTH",                 # pathlib 替代 os.path
    "TID",                 # import 排序
    "ISC",                 # implicit str concat
    "PIE",                 # misc errors
]
ignore = [
    "E501", "SIM108", "SIM115", "RUF001", "RUF002", "RUF003", "RUF012",
    "UP038",   # isinstance X | Y syntax
    "PTH123", "PTH118", "PTH120", "PTH110", "PTH105", "PTH108",  # pathlib
    "PIE810",  # startswith tuple
    "ISC001",  # conflicts with formatter
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ALL"]
"scripts/*" = ["ALL"]
"src/gugu/notifier/flow_report.py" = ["E402"]
"src/gugu/strategies/registry.py" = ["F821"]
"src/gugu/web/app.py" = ["E402"]
"src/gugu/analysis/ml_factor.py" = ["N806"]
"src/gugu/strategies/fanbao/rules.py" = ["F841", "B018", "SIM102"]
"src/gugu/strategies/rebound/rules.py" = ["SIM102"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 7
max-returns = 4

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# === 项目质量标准 ===
[tool.quality]
max-file-lines = 500
max-function-lines = 50
max-class-lines = 300
min-test-coverage = 70
min-assertions-per-test = 1

[tool.bandit]
# B310: urllib.urlopen (used for data source HTTP fetch, intentional)
# B323: _create_unverified_context (for tencent finance SSL, intentional)
# B324: MD5 hash (used for card dedup fingerprint, not security-sensitive)
skips = ["B310", "B323", "B324"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3",
]

# Pre-commit hooks for gugu project (高性能版本)
# 安装: pip install pre-commit && pre-commit install
# 手动运行: pre-commit run --all-files

default_language_version:
  python: python3.11

repos:
  # === 代码格式（快速）===
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.4
    hooks:
      - id: ruff
        name: ruff lint + fix
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff format

  # === 安全扫描（中速）===
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: bandit security scan
        args: [-c, pyproject.toml, -ll]
        additional_dependencies: [tomli]

  # === 自定义质量门禁（快速）===
  - repo: local
    hooks:
      - id: check-debug-code
        name: check debug code (breakpoint, pdb, print)
        entry: python scripts/check_debug_code.py
        language: python
        types: [python]
        pass_filenames: false

ci:
  autofix_prs: true
  skip: []
  submodules: false

# Pre-commit hooks for gugu project (高性能版本)
# 安装: pip install pre-commit && pre-commit install
# 手动运行: pre-commit run --all-files

default_language_version:
  python: python3.11

repos:
  # === 代码格式（快速）===
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 必须与 uv.lock 里的 ruff 版本一致（ci.yml / quality-gate.yml 都用它）。
    # 原先是 v0.5.4，比 CI 的 0.15.18 落后十几个版本，本地钩子放过的代码
    # CI 会拦下；反过来上游一发版 `pip install ruff` 又会引入新规则。
    rev: v0.15.18
    hooks:
      - id: ruff
        name: ruff lint + fix
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff format

  # === 安全扫描（中速）===
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: bandit security scan
        args: [-c, pyproject.toml, -ll]
        additional_dependencies: [tomli]

  # === 自定义质量门禁（快速）===
  - repo: local
    hooks:
      - id: check-debug-code
        name: check debug code (breakpoint, pdb, print)
        entry: python scripts/check_debug_code.py
        language: python
        types: [python]
        pass_filenames: false
      - id: param-audit
        name: strategy param closed-loop audit (defaults must be read by code)
        # 2026-08-01 P1 完成：33/33 闭环，升级为 --strict 阻断新增断裂
        entry: python scripts/verify_strategies.py param-audit --strict
        language: python
        types: [yaml]
        pass_filenames: false
        additional_dependencies:
          - pandas
          - numpy
          - pyyaml
          - pydantic
          - pydantic-settings
          - loguru
          - httpx

ci:
  autofix_prs: true
  skip: []
  submodules: false
